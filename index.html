<title>아스텔지움 아카데미</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Jua&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" media="print" data-font>
<style>
/* 1600×900 고정 무대. 위 = 적의 무대, 아래 = 아군 초상화(왼쪽) · 손패(가운데) · 자원(오른쪽). */
:root{
  --sky:#f3f0fb; --sky2:#ebe6f8; --floor:#f8f6fd; --paper:#ffffff; --panel:#faf8fe; --line:#e6def3; --line2:#d3c6ea;
  --ink:#2b2440; --sub:#6b6283; --mute:#a49cb8;
  --blue:#8b6cf0; --gold:#f5c451; --gold-d:#8a5a00; --pink:#ff6b8a; --pink-bg:#ffe3ea; --red:#c8304f; --mana:#6e8cf5;
  --display:'Montserrat','Noto Sans KR',system-ui,sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
  --body:'Noto Sans KR',system-ui,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:#e9e2f6;color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px);box-sizing:border-box}
#fit{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#holder{position:relative}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:var(--sky);overflow:hidden;border-radius:6px;box-shadow:0 8px 40px rgba(43,36,64,.18)}
#screen{position:absolute;inset:0}
#fx,#toasts{position:absolute;inset:0;pointer-events:none;z-index:90}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.disp{font-family:var(--display);font-weight:800}

/* 상단 바 */
.top{position:absolute;left:0;right:0;top:0;height:56px;box-sizing:border-box;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-bottom:1px solid var(--line);z-index:20}
.tl,.tr{display:flex;align-items:center;gap:10px}
.badge{height:30px;padding:0 10px;border-radius:8px;background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;font-size:18px;display:flex;align-items:center}
.loc b{font-family:var(--display);font-weight:800;font-size:21px}
.loc span{font-size:14px;color:var(--sub);margin-left:10px}
.pill{height:36px;padding:0 14px;border-radius:18px;background:#f6f2fc;border:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.coin{width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid #e0a400;box-sizing:border-box}
.btn{height:36px;padding:0 16px;border-radius:18px;background:#fff;border:1px solid var(--line2);font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:#f6f2fc}
.btn.primary{background:var(--blue);border:none;color:#fff;font-family:var(--display);font-weight:800;font-size:20px;height:52px;padding:0 28px;border-radius:16px}
.btn.primary:hover{background:#7656e0}
.turn{font-family:var(--display);font-weight:800;font-size:22px;color:var(--blue)}
.turn small{font-family:var(--body);font-size:14px;font-weight:700;color:var(--sub);margin-right:6px}

/* 적의 무대 */
.field{position:absolute;left:0;right:0;top:56px;height:664px;background:var(--sky2);overflow:hidden}
.dome{position:absolute;left:400px;right:120px;top:40px;height:780px;border-radius:800px 800px 0 0;border:3px solid #e0d6f5}
.city{position:absolute;left:300px;right:0;bottom:120px;display:flex;align-items:flex-end;justify-content:center;gap:14px}
.city i{display:block;background:#c9e2f8;border-radius:6px 6px 0 0}
.ground{position:absolute;left:0;right:0;bottom:0;height:120px;background:var(--floor);border-top:2px solid #cfe4f8}
.foes{position:absolute;left:360px;right:230px;bottom:26px;display:flex;justify-content:center;align-items:flex-end;gap:48px}
.foe{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;padding:0;cursor:default;position:relative}
.foe .art{position:relative;display:flex;justify-content:center}
.foe .shadow{width:150px;height:14px;border-radius:50%;background:#e2d9f1;margin-top:-10px}
.foe.tg{cursor:pointer}
.foe.tg .shadow{background:none;border:3px solid var(--pink);box-sizing:border-box;animation:pulse .8s ease-in-out infinite alternate}
.foe.tg:hover .art{transform:translateY(-4px)}
@keyframes pulse{from{transform:scale(.92)}to{transform:scale(1.08)}}
.fplate{width:190px;box-sizing:border-box;padding:7px 10px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;text-align:left;position:relative}
.fplate b{font-family:var(--display);font-weight:800;font-size:20px}
.bar{height:8px;border-radius:4px;background:var(--pink-bg);overflow:hidden}
.bar i{display:block;height:8px;background:var(--pink);transition:width .25s}
.bar.mp{background:#efe9fb}
.bar.mp i{background:var(--mana)}
.nums{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.sts{display:flex;flex-wrap:wrap;gap:3px;min-height:18px}
.st{font-size:13px;font-weight:700;padding:1px 6px;border-radius:8px;white-space:nowrap;cursor:help}
.blk{position:absolute;right:8px;top:-11px;font-size:13px;font-weight:700;padding:2px 8px;border-radius:10px;background:#efe9fb;color:#1a5fb4;border:1px solid var(--line2)}
.intent{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:15px;font-weight:700;white-space:nowrap;cursor:help}
.intent.seen{border-color:var(--gold)}
.intent .ik{font-size:13px;padding:2px 6px;border-radius:8px;color:#fff;background:var(--gold-d)}
.intent .ik.spell{background:var(--blue)}
.intent .it{color:var(--mute)}
.intent.seen .it{color:var(--red)}
.intent.skip{color:var(--mute)}
.lines{position:absolute;inset:0;pointer-events:none;z-index:15}
.banner{position:absolute;left:50%;top:116px;transform:translateX(-50%);font-weight:700;font-size:17px;background:#fff;border:2px solid var(--blue);color:var(--blue);padding:8px 20px;border-radius:20px;z-index:16;white-space:nowrap}
.banner.enemy{color:var(--red);border-color:var(--red)}

/* 하단: 손패 전용 칸 */
.dock{position:absolute;left:0;right:0;bottom:0;height:180px;background:var(--panel);border-top:1px solid var(--line);z-index:5}
.hint{font-size:14px;color:var(--sub);line-height:1.6}

/* 아군 초상화: 무대 왼쪽 세로 */
.party{position:absolute;left:24px;top:80px;display:flex;flex-direction:column;gap:10px;z-index:12}
.mate{position:relative;width:292px;height:132px;box-sizing:border-box;border-radius:18px;background:#fff;border:2px solid var(--line);display:flex;text-align:left;cursor:default;box-shadow:0 4px 14px rgba(43,36,64,.08)}
.mate .ph{width:106px;flex:none;border-radius:16px 0 0 16px;background:color-mix(in srgb, var(--rc) 14%, #fff);display:flex;justify-content:center;align-items:flex-end;overflow:hidden;position:relative}
.mate .rl{position:absolute;left:7px;top:7px;font-size:13px;font-weight:700;color:#fff;background:var(--rc);padding:2px 7px;border-radius:8px;z-index:1}
.mate .bd{flex:1;min-width:0;padding:10px 40px 8px 12px;display:flex;flex-direction:column;gap:4px}
.mate .nmrow{display:flex;align-items:center;gap:6px}
.mate .nm{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.mate .perk{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--rc);color:var(--rc);font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:help;box-sizing:border-box}
.mate .opn{font-size:13px;font-weight:700;color:var(--rc);background:color-mix(in srgb, var(--rc) 10%, #fff);border-radius:8px;padding:3px 8px;align-self:flex-start}
.mate .sts{min-height:16px}
.ultb{position:absolute;right:-30px;top:50%;width:64px;height:64px;margin-top:-32px;border-radius:50%;border:4px solid #fff;background:#d0cae0;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(43,36,64,.22);padding:0;z-index:3;box-sizing:border-box}
.ultb b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.ultb > span{font-size:12px;font-weight:700;letter-spacing:1px}
.ultb.ready{background:var(--rc);animation:ready 1.4s ease-in-out infinite}
.ultb.ready:hover{transform:scale(1.08)}
@keyframes ready{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--rc) 55%, transparent)}50%{box-shadow:0 0 0 10px color-mix(in srgb, var(--rc) 0%, transparent)}}
.ultb .un{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:14px;font-weight:700;letter-spacing:0;padding:5px 10px;border-radius:10px;white-space:nowrap;display:none}
.ultb:hover .un{display:block}
.mate.owner{border-color:var(--rc);box-shadow:0 0 0 3px color-mix(in srgb, var(--rc) 35%, transparent)}
.mate.tg{cursor:pointer;border-color:var(--pink);animation:glow .8s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 2px rgba(255,107,138,.35)}to{box-shadow:0 0 0 7px rgba(255,107,138,.55)}}
.mate.dead{filter:grayscale(1);opacity:.5}
.mate .incoming{position:absolute;top:-10px;left:112px;font-size:14px;font-weight:700;color:#fff;background:var(--red);padding:2px 9px;border-radius:10px;white-space:nowrap;z-index:2}
.mate .blk{top:-10px;right:44px}

/* 손패: 평소엔 윗부분만, 올리면 전체 */
.hand{position:absolute;left:300px;width:1000px;bottom:0;height:180px;z-index:30}
.card{position:absolute;width:176px;height:248px;padding:0;border:none;background:none;cursor:pointer;text-align:left;transform-origin:50% 100%;transition:transform .14s ease, filter .14s}
.hand .card{bottom:-100px;transform:translateY(var(--dy)) rotate(var(--rot))}
.hand .card:hover{transform:translateY(-150px) scale(1.34);z-index:80 !important}
.hand .card.sel{transform:translateY(-122px) scale(1.18);z-index:79 !important}
.card.off .gem{background:#d0cae0;color:#fff}
.hand .card.sel .cf{box-shadow:0 0 0 4px var(--blue), 0 12px 30px rgba(43,36,64,.25)}
.cf{position:absolute;inset:0;border-radius:14px;background:#fff;border:3px solid var(--rc);box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 3px 10px rgba(43,36,64,.12)}
.card.off .cf{filter:saturate(.35);opacity:.72}
.gem{position:absolute;left:-8px;top:-8px;width:40px;height:40px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 2px 6px rgba(43,36,64,.25);font-family:var(--display);font-weight:800;font-size:24px;color:var(--ink);display:flex;align-items:center;justify-content:center;z-index:2}
.gem.mana{background:var(--blue);color:#fff;border-radius:50% 50% 50% 8px}
.gem.down{background:#6fd3a6;color:var(--ink)}
.gem.mana.down{background:#2fa97a;color:#fff}
.cart{height:92px;background:color-mix(in srgb, var(--rc) 16%, #fff);display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden}
.cart .neutral{font-size:13px;font-weight:700;letter-spacing:3px;color:#fff;background:var(--rc);padding:3px 10px;border-radius:10px;align-self:center}
.cname{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1;text-align:center;padding:7px 8px 0}
.ctype{font-size:13px;font-weight:700;color:var(--sub);text-align:center;padding-top:2px}
.cdesc{padding:6px 11px 0;font-size:14px;line-height:1.5;color:#463d5e;text-align:center}
.cdesc b{color:var(--ink)}
.ctag{position:absolute;right:8px;top:8px;font-size:13px;font-weight:700;padding:2px 6px;border-radius:8px;background:#fff;color:var(--sub);border:1px solid var(--line)}
.why{position:absolute;left:8px;right:8px;bottom:8px;font-size:13px;font-weight:700;color:var(--red);text-align:center;background:#fff;border-radius:8px;padding:2px 0}
.kw{position:absolute;left:calc(100% + 8px);top:0;width:178px;display:none;flex-direction:column;gap:5px;pointer-events:none}
.kw.l{left:auto;right:calc(100% + 8px)}
.kw div{background:var(--ink);color:#fff;border-radius:10px;padding:7px 9px;font-size:13px;line-height:1.45}
.kw div b{display:block;font-size:14px;color:var(--gold)}
.hand .card:hover .kw,.big .kw{display:flex}

/* 자원: 왼쪽 아래 행동력·덱, 오른쪽 아래 사용한 카드 */
.dl,.dr{position:absolute;bottom:16px;width:260px;height:148px;display:flex;flex-direction:column;gap:10px;z-index:10}
.dl{left:20px}.dr{right:20px}
.apbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.aprow{display:flex;align-items:baseline;justify-content:space-between}
.aprow b{font-size:15px;color:var(--sub)}
.aprow span{font-family:var(--display);font-weight:800;font-size:30px;color:var(--gold-d);font-variant-numeric:tabular-nums;line-height:1}
.aprow span small{font-size:18px;color:var(--sub)}
.crys{display:flex;gap:4px}
.crys i{width:14px;height:14px;transform:rotate(45deg);border-radius:3px;box-sizing:border-box;background:#f1eff6;border:2px solid #d6e0ea}
.crys i.full{background:var(--gold);border-color:#e0a400}
.crys i.open{background:#fff;border-color:#e0a400}
.pile{height:52px;border-radius:14px;background:#fff;border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.pile:hover{background:#f6f2fc}
.pile b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.pile span{font-size:15px;font-weight:700;color:var(--sub)}
.endturn{position:absolute;right:28px;top:350px;width:176px;height:74px;border-radius:37px;background:var(--blue);border:4px solid #fff;color:#fff;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:2px;cursor:pointer;z-index:12;box-shadow:0 6px 18px rgba(139,108,240,.35)}
.endturn:hover{background:#7656e0;transform:scale(1.04)}
.endturn[disabled]{background:#bfb1d9;cursor:not-allowed;box-shadow:none;transform:none}
.endturn.enemy[disabled]{background:var(--red)}
.endturn small{display:block;font-family:var(--body);font-size:13px;letter-spacing:0;opacity:.8}

/* 모달 */
.veil{position:absolute;inset:0;background:rgba(43,36,64,.42);display:flex;align-items:center;justify-content:center;z-index:70}
.modal{background:#fff;border-radius:22px;padding:26px 30px;box-sizing:border-box;max-width:1360px;max-height:840px;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(43,36,64,.3)}
.modal h2{margin:0;font-family:var(--display);font-weight:800;font-size:32px}
.modal p{margin:0;color:#463d5e;line-height:1.65;font-size:17px}
.cardgrid{display:flex;flex-wrap:wrap;gap:22px 18px;justify-content:center;padding:10px 6px}
.cardgrid .card,.slot .card{position:relative}
.cardgrid .card:hover{transform:translateY(-6px)}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line2);background:#fff;font-size:15px;font-weight:700;cursor:pointer}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:56px;padding:12px 18px;border-radius:14px;border:2px solid var(--line2);background:#fff;cursor:pointer;text-align:left;font-size:17px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.opt:hover{border-color:var(--blue);background:#faf8fe}
.opt span{font-size:14px;font-weight:500;color:var(--sub)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.price{font-family:var(--display);font-weight:800;font-size:20px}
.big{position:relative;width:176px;height:248px;transform:scale(1.7);transform-origin:0 0;margin:0 0 174px 0}
.bigwrap{display:flex;gap:150px;align-items:flex-start;padding:10px 20px 0}
.detail{width:360px;display:flex;flex-direction:column;gap:10px;margin-left:150px}

/* 지도 */
.mleft{position:absolute;left:0;top:56px;bottom:0;width:340px;background:#fff;border-right:1px solid var(--line);box-sizing:border-box;padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:14px;font-weight:700;color:var(--sub)}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.row .who{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.row .who b{font-size:16px;display:flex;justify-content:space-between}
.row .who b span{font-size:13px;color:var(--sub)}
.row .av{width:44px;height:44px;border-radius:12px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;flex:none}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.item{height:54px;border-radius:12px;background:#fff;border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:10px;padding:0 12px;text-align:left}
.item b{font-family:var(--display);font-weight:800;font-size:20px;color:var(--blue)}
.item span{font-size:15px;font-weight:700}
.item:hover{background:#faf8fe}
.item[disabled]{opacity:.4;cursor:not-allowed}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#463d5e;margin-top:auto}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-style:normal;font-weight:700}
.corr{position:absolute;left:340px;right:0;top:56px;height:196px;background:var(--floor);overflow:hidden;border-bottom:1px solid var(--line)}
.wins{position:absolute;left:0;right:0;top:20px;display:flex;justify-content:space-around;padding:0 40px}
.wins i{display:block;width:150px;height:84px;border-radius:10px;border:5px solid #fff;background:#cfe7fd;box-sizing:border-box}
.mfloor{position:absolute;left:0;right:0;bottom:0;height:60px;background:#ece6f8;border-top:3px solid #e2d9f1}
.walkers{position:absolute;left:40px;bottom:12px;display:flex;gap:0;align-items:flex-end}
.walking .walkers svg{animation:bob .45s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.roomcard{position:absolute;right:28px;top:22px;width:470px;box-sizing:border-box;padding:16px 20px;border-radius:16px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.roomcard small{font-size:14px;font-weight:700;color:var(--sub)}
.roomcard b{font-family:var(--display);font-weight:800;font-size:26px}
.roomcard p{margin:0;font-size:15px;color:#463d5e;line-height:1.55}
.mapbox{position:absolute;left:340px;right:0;top:252px;bottom:0;background:#fff}
.edge{position:absolute;height:4px;margin-top:-2px;background:#ece5f7;transform-origin:0 50%}
.seg{position:absolute;width:22px;height:22px;border-radius:5px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.room{position:absolute;width:76px;height:76px;border-radius:18px;box-sizing:border-box;padding:0;font-family:var(--display);font-weight:800;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.room.can{box-shadow:0 0 0 5px rgba(255,200,61,.55)}
.room.can:hover{box-shadow:0 0 0 8px rgba(255,200,61,.85)}
.room .lock{position:absolute;bottom:-22px;font-family:var(--body);font-size:13px;font-weight:700;color:var(--red);white-space:nowrap}
.room .nm{position:absolute;bottom:-20px;font-family:var(--body);font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
.marker{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--blue);border:4px solid var(--gold);box-sizing:border-box;transition:left .22s, top .22s;pointer-events:none;z-index:3}
.alert{display:flex;gap:3px}
.alert i{width:12px;height:12px;border-radius:3px;background:#ece5f7}
.alert i.on{background:var(--gold)}

/* 타이틀/결과 */
.title{position:absolute;inset:0;background:var(--sky);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.logo{font-family:var(--display);font-weight:800;font-size:80px;line-height:1;letter-spacing:2px;text-align:center}
.logo small{display:block;font-size:22px;color:var(--blue);letter-spacing:8px;margin-bottom:10px}
.halo{width:250px;height:38px;border-radius:50%;border:6px solid var(--blue);margin-bottom:-16px}
.roster{display:flex;gap:14px}
.mem{width:300px;box-sizing:border-box;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.mem .hd{display:flex;align-items:center;gap:12px}
.mem .hd b{font-family:var(--display);font-weight:800;font-size:24px}
.mem p{margin:0;font-size:15px;line-height:1.55;color:#463d5e}
.mem p b{color:var(--ink)}
.role{font-size:13px;font-weight:700;color:#fff;padding:2px 7px;border-radius:8px}
.keys{font-size:15px;color:var(--sub)}

/* 연출 */
.float{position:absolute;font-family:var(--display);font-weight:800;font-size:30px;transform:translate(-50%,0);animation:rise 1.1s ease-out backwards;text-shadow:0 3px 0 #fff,0 -3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff;white-space:nowrap}
.float.big{font-size:46px}
@keyframes rise{0%{opacity:0;transform:translate(-50%,12px) scale(.5)}14%{opacity:1;transform:translate(-50%,0) scale(1.3)}28%{transform:translate(-50%,-4px) scale(1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

/* 타격 · 행동 */
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes flash{0%{filter:brightness(2.4) saturate(.3)}100%{filter:none}}
@keyframes redflash{0%{box-shadow:0 0 0 7px rgba(200,48,79,.65)}100%{box-shadow:0 0 0 0 rgba(200,48,79,0)}}
.foe.hit .art{animation:hit .36s ease, flash .32s ease}
.mate.hit{animation:hit .36s ease, redflash .45s ease}
.foe.lunge .art{animation:lunge .4s ease}
@keyframes lunge{0%{transform:none}45%{transform:translateY(34px) scale(1.14)}100%{transform:none}}
.foe.cast .art{animation:cast .5s ease}
@keyframes cast{0%{filter:none;transform:none}50%{filter:drop-shadow(0 0 22px #6e8cf5) brightness(1.15);transform:translateY(-10px)}100%{filter:none;transform:none}}
.foe.dying{animation:die .6s ease forwards;pointer-events:none}
@keyframes die{to{opacity:0;transform:translateY(30px) scale(.88);filter:grayscale(1)}}
#screen.shake{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-10px,6px)}30%{transform:translate(9px,-6px)}45%{transform:translate(-7px,4px)}60%{transform:translate(5px,-3px)}80%{transform:translate(-2px,1px)}}
.hand .card.fresh{animation:drawIn .45s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes drawIn{from{transform:translate(-620px,40px) rotate(-24deg) scale(.45);opacity:0}}
.crys i.pop{animation:pop .32s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes pop{from{transform:rotate(45deg) scale(0)}}
.ghost{position:absolute;pointer-events:none;z-index:85;transform-origin:50% 50%}

/* 학명 컷인 */
.cutdim{position:absolute;inset:0;background:rgba(43,36,64,.4);animation:dimio 1.25s ease forwards}
@keyframes dimio{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
.cutin{position:absolute;left:-12%;right:-12%;top:270px;height:270px;background:var(--rc);transform:skewY(-6deg);display:flex;align-items:flex-end;gap:36px;padding-left:24%;overflow:hidden;animation:cutin 1.25s cubic-bezier(.2,.8,.3,1) forwards;box-shadow:0 0 0 8px #fff}
.cutin > *{transform:skewY(6deg)}
@keyframes cutin{0%{transform:skewY(-6deg) translateX(-115%)}16%{transform:skewY(-6deg) translateX(0)}80%{transform:skewY(-6deg) translateX(2%)}100%{transform:skewY(-6deg) translateX(115%)}}
.cbars{position:absolute;inset:0;transform:none}
.cbars i{position:absolute;left:0;right:0;height:6px;background:rgba(255,255,255,.22);animation:bars .6s linear infinite}
.cbars i:nth-child(1){top:30px}.cbars i:nth-child(2){top:120px;height:3px}.cbars i:nth-child(3){top:220px;height:10px}
@keyframes bars{from{transform:translateX(-30%)}to{transform:translateX(30%)}}
.cbust{width:260px;height:270px;display:flex;align-items:flex-end;justify-content:center;background:rgba(255,255,255,.18);position:relative}
.ctxt{display:flex;flex-direction:column;gap:4px;color:#fff;padding-bottom:58px;position:relative}
.ctxt small{font-size:20px;font-weight:700;letter-spacing:4px;opacity:.9}
.ctxt b{font-family:var(--display);font-weight:800;font-size:86px;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.ctxt span{font-size:20px;font-weight:700}

/* 턴 전환 · 결과 */
.turnban{position:absolute;left:0;right:0;top:300px;height:100px;display:flex;align-items:center;justify-content:center;gap:18px;font-family:var(--display);font-weight:800;font-size:58px;color:#fff;background:var(--blue);letter-spacing:6px;animation:ban 1.05s ease forwards;z-index:86}
.turnban.enemy{background:var(--red)}
.turnban small{font-size:22px;letter-spacing:3px;opacity:.85}
@keyframes ban{0%{clip-path:inset(0 100% 0 0)}22%{clip-path:inset(0 0 0 0)}74%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 100%);opacity:.6}}
.stamp{position:absolute;left:50%;top:280px;font-family:var(--display);font-weight:800;font-size:100px;color:var(--blue);border:9px solid var(--blue);border-radius:26px;padding:4px 44px;background:rgba(255,255,255,.94);animation:stamp 1.1s ease forwards;z-index:89;white-space:nowrap}
.stamp.lose{color:var(--red);border-color:var(--red)}
@keyframes stamp{0%{transform:translate(-50%,0) rotate(-8deg) scale(2.4);opacity:0}22%{transform:translate(-50%,0) rotate(-8deg) scale(1);opacity:1}30%{transform:translate(-50%,0) rotate(-8deg) scale(1.06)}38%{transform:translate(-50%,0) rotate(-8deg) scale(1)}88%{opacity:1}100%{transform:translate(-50%,0) rotate(-8deg) scale(1);opacity:0}}
.room.enter{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:17px;padding:10px 20px;border-radius:20px;animation:toast 2.2s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
/* 툴팁 · 학명/특전 설명 카드 */
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--body);font-size:14px;font-weight:500;letter-spacing:0;line-height:1.5;padding:7px 11px;border-radius:10px;width:max-content;max-width:240px;white-space:normal;text-align:left;z-index:60;pointer-events:none}
.mate .perk{position:relative}
.pop{position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);width:290px;background:#fff;border:2px solid var(--rc);border-radius:16px;box-shadow:0 14px 34px rgba(43,36,64,.24);display:none;flex-direction:column;align-items:stretch;text-align:left;color:var(--ink);z-index:70;cursor:default;font-family:var(--body);letter-spacing:0;font-size:15px;font-weight:400}
.pop::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;width:13px;height:13px;background:var(--rc);transform:rotate(45deg)}
.ultb:hover .pop,.ultb:focus-visible .pop,.perk:hover .pop,.perk:focus .pop{display:flex}
.pop .ph2{display:flex;justify-content:space-between;align-items:center;background:var(--rc);color:#fff;font-size:13px;font-weight:700;letter-spacing:2px;padding:7px 12px;border-radius:13px 13px 0 0;position:relative}
.pop .ph2 em{font-style:normal;letter-spacing:0;background:rgba(255,255,255,.24);padding:1px 8px;border-radius:8px}
.pop > b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;padding:10px 14px 2px;color:var(--ink)}
.pop .pm{display:flex;gap:6px;padding:4px 14px 0}
.pop .pm span{font-size:13px;font-weight:700;letter-spacing:0;padding:2px 8px;border-radius:8px;background:#f4f2f8;color:var(--sub)}
.pop .pm .pc{background:var(--gold);color:var(--ink)}
.pop .pd{font-size:15px;font-weight:400;letter-spacing:0;line-height:1.6;color:#463d5e;padding:8px 14px 12px}
.pop .pd b{font-family:var(--body);font-size:inherit;line-height:inherit;font-weight:700;color:var(--ink)}
.pop .pq{font-size:14px;font-weight:700;letter-spacing:0;color:var(--rc);padding:0 14px 12px;margin-top:-4px}
.mate.peek{border-color:var(--rc);box-shadow:0 0 0 3px color-mix(in srgb, var(--rc) 30%, transparent)}
.endturn.nudge{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:0 6px 18px rgba(139,108,240,.35)}50%{box-shadow:0 0 0 12px rgba(255,200,61,.65)}}
.pv{font-weight:700;color:var(--red)}
.pv.kill{color:#fff;background:var(--red);padding:0 6px;border-radius:6px}
/* 이번 턴 전개 띠 */
.log{position:absolute;left:340px;right:230px;top:66px;height:36px;display:flex;align-items:center;gap:6px;z-index:14}
.lgh{flex:none;font-size:13px;font-weight:700;letter-spacing:1px;color:#fff;background:var(--ink);padding:5px 10px;border-radius:12px}
.lgm,.lga{flex:none;font-size:15px;font-weight:700;color:var(--mute)}
.lge{font-size:14px;color:var(--sub)}
.lg{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 4px;border-radius:15px;background:#fff;border:2px solid var(--rc);font-size:14px;font-weight:700;white-space:nowrap;cursor:help}
.lg i{font-style:normal}
.lgn{width:20px;height:20px;border-radius:50%;background:var(--rc);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.lgc{width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:13px;display:flex;align-items:center;justify-content:center}
.lgc.mana{background:var(--blue);color:#fff;border-radius:50% 50% 50% 4px}
.lg em{font-style:normal;color:var(--sub);font-weight:500}
.lg b{color:var(--red)}
.lg.ult{background:var(--rc);color:#fff}
.lg.ult .lgn{background:#fff;color:var(--rc)}
.lg.en{--rc:#e6c7cf;padding-left:10px;cursor:default;animation:none}
.lgb{flex:none;margin-left:auto;height:30px;padding:0 12px;border-radius:15px;background:#fff;border:1px solid var(--line2);font-size:14px;font-weight:700;cursor:pointer}
.lgb:hover{background:#f6f2fc}
.log [data-tip]:hover::after{bottom:auto;top:calc(100% + 8px)}
.lt{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.lth{font-family:var(--display);font-weight:800;font-size:20px;color:var(--blue)}
.ltr{display:flex;gap:10px;align-items:flex-start}
.ltl{flex:none;width:56px;font-size:14px;font-weight:700;color:var(--blue);padding-top:6px}
.ltl.en{color:var(--red)}
.ltc{display:flex;flex-wrap:wrap;gap:6px}
.ltc .lg{animation:none}
/* ───── 메타 화면 공통 (기본) ───── */
.mhead{position:absolute;left:0;right:0;top:0;height:64px;box-sizing:border-box;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);z-index:20}
.mhead .tl{gap:14px}
.back{height:40px;padding:0 16px 0 12px;border-radius:20px;background:var(--ink);color:#fff;border:none;font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:6px}
.back:hover{background:#3a3152}
.mtitle{font-family:var(--display);font-weight:800;font-size:30px}
.res2{height:40px;padding:0 14px;border-radius:20px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.res2 small{font-size:13px;color:var(--sub);font-weight:700}
.res2 .plus{width:24px;height:24px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-weight:900;cursor:pointer;line-height:1;padding:0}
.ico{flex:none}
.sky{position:absolute;inset:0;background:var(--sky);overflow:hidden}
.sky .dome{left:120px;right:120px;top:80px;height:900px}
.sky .city{left:0;bottom:110px}
.sky .ground{height:110px}

/* 로비 */
.leader{position:absolute;left:150px;bottom:100px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2}
.leader .say{position:absolute;left:250px;top:40px;width:260px;background:#fff;border:2px solid var(--line2);border-radius:18px;padding:12px 16px;font-size:17px;line-height:1.55;font-weight:500;box-shadow:0 6px 18px rgba(43,36,64,.1)}
.leader .say b{display:block;font-family:var(--display);font-weight:800;font-size:20px;color:var(--rc)}
.leader .plate{background:#fff;border-radius:16px;padding:8px 18px;border:2px solid var(--rc);font-family:var(--display);font-weight:800;font-size:24px;display:flex;align-items:center;gap:10px}
.leader .plate span{font-family:var(--body);font-size:14px;font-weight:700;color:var(--sub)}
.leader svg{filter:drop-shadow(0 10px 18px rgba(43,36,64,.18));animation:idle 3s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.menu{position:absolute;right:56px;top:120px;display:grid;grid-template-columns:repeat(2,264px);gap:18px;z-index:3}
.tile{position:relative;height:200px;border-radius:24px;border:none;cursor:pointer;color:#fff;text-align:left;padding:22px 24px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden;box-shadow:0 10px 24px rgba(43,36,64,.18);transition:transform .15s}
.tile:hover{transform:translateY(-4px)}
.tile b{font-family:var(--display);font-weight:800;font-size:44px;line-height:1}
.tile span{font-size:15px;font-weight:700;opacity:.9}
.tile svg{position:absolute;right:16px;top:16px;opacity:.35}
.tile.big{grid-column:span 2;height:220px}
.tile .badge2{position:absolute;left:20px;top:18px;font-size:14px;font-weight:700;background:rgba(255,255,255,.25);padding:4px 10px;border-radius:12px}
.partyrow{position:absolute;left:40px;bottom:22px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px 14px;z-index:3}
.partyrow .pf{width:52px;height:56px;border-radius:12px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.partyrow small{font-size:14px;font-weight:700;color:var(--sub);margin-right:4px}
.news{position:absolute;left:560px;right:56px;bottom:22px;height:44px;background:var(--ink);color:#fff;border-radius:22px;display:flex;align-items:center;gap:12px;padding:0 18px;font-size:16px;overflow:hidden;z-index:3}
.news b{flex:none;font-size:13px;letter-spacing:2px;background:var(--gold);color:var(--ink);padding:3px 9px;border-radius:10px}
.news span{white-space:nowrap}

/* 작전 */
.chtabs{position:absolute;left:24px;top:88px;width:220px;display:flex;flex-direction:column;gap:10px}
.chtab{height:96px;border-radius:18px;border:2px solid var(--line);background:#fff;cursor:pointer;text-align:left;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.chtab.on{border-color:var(--blue);box-shadow:0 0 0 4px rgba(139,108,240,.15)}
.chtab small{font-size:13px;font-weight:700;color:var(--blue);letter-spacing:2px}
.chtab b{font-family:var(--display);font-weight:800;font-size:20px}
.chtab span{font-size:14px;color:var(--sub);font-weight:700}
.chtab[disabled]{opacity:.5;cursor:not-allowed}
.stgrid{position:absolute;left:268px;top:88px;width:820px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stcard{position:relative;height:170px;border-radius:18px;border:2px solid var(--line);background:#fff;cursor:pointer;text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-sizing:border-box}
.stcard:hover{border-color:var(--line2)}
.stcard.on{border-color:var(--blue);box-shadow:0 0 0 4px rgba(139,108,240,.15)}
.stcard.boss{background:#2b2440;color:#fff;border-color:#2b2440}
.stcard .no{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--blue)}
.stcard.boss .no{color:var(--gold)}
.stcard .nm{font-weight:700;font-size:17px}
.stcard .kd{font-size:13px;font-weight:700;color:var(--sub)}
.stcard.boss .kd{color:#d9d0ea}
.stcard .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.stcard[disabled]{cursor:not-allowed}
.stcard .lockv{position:absolute;inset:0;border-radius:16px;background:rgba(234,244,255,.82);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--sub);font-size:15px}
.stars{display:flex;gap:2px}
.stars svg{display:block}
.en{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:700;color:var(--gold-d)}
.stcard.boss .en{color:var(--gold)}
.stdetail{position:absolute;right:24px;top:88px;width:470px;bottom:24px;background:#fff;border-radius:22px;border:1px solid var(--line);padding:22px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.stdetail h2{margin:0;font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1}
.stdetail .sub{font-size:15px;color:var(--sub);font-weight:700}
.stdetail p{margin:0;font-size:16px;line-height:1.6;color:#463d5e}
.foeprev{display:flex;gap:10px;align-items:flex-end;background:var(--sky2);border-radius:16px;padding:10px 14px;min-height:110px}
.foeprev div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--sub)}
.conds{display:flex;flex-direction:column;gap:6px}
.cond{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;padding:8px 12px;border-radius:12px;background:#faf8fe;border:1px solid var(--line)}
.cond.got{background:#fff8e0;border-color:#f3d77a}
.rw{display:flex;flex-wrap:wrap;gap:8px}
.rw span{font-size:14px;font-weight:700;padding:5px 10px;border-radius:12px;background:#f4f2f8;color:var(--sub)}
.go{margin-top:auto;height:70px;border-radius:20px;border:none;background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;font-size:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px}
.go:hover{background:#7656e0}
.go small{font-family:var(--body);font-size:16px;font-weight:700;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:12px}
.go[disabled]{background:#bfb1d9;cursor:not-allowed}

/* 편성 */
.slots{position:absolute;left:24px;right:24px;top:84px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.slot2{height:176px;border-radius:20px;background:#fff;border:2px solid var(--rc);display:flex;overflow:hidden;position:relative}
.slot2 .ph{width:132px;flex:none;background:color-mix(in srgb, var(--rc) 14%, #fff);display:flex;align-items:flex-end;justify-content:center}
.slot2 .bd{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.slot2 .rl{align-self:flex-start;font-size:13px;font-weight:700;color:#fff;background:var(--rc);padding:2px 8px;border-radius:9px}
.slot2 .nm{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.slot2 .club{font-size:14px;color:var(--sub);font-weight:700}
.slot2 .swap{margin-top:auto;display:flex;gap:6px}
.slot2 .swap button{flex:1;height:34px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-size:14px;font-weight:700;cursor:pointer}
.slot2 .swap button:hover{background:#f6f2fc}
.slot2 .swap button[disabled]{opacity:.4;cursor:not-allowed}
.synergy{position:absolute;left:24px;top:272px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.synergy span{padding:4px 10px;border-radius:12px}
.editor{position:absolute;left:24px;right:24px;top:306px;bottom:20px;display:flex;gap:16px}
.owned{flex:1;min-width:0;background:#fff;border-radius:20px;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.owned .tabs{padding:12px 14px;border-bottom:1px solid var(--line)}
.ogrid{flex:1;overflow-y:auto;padding:14px;display:flex;flex-wrap:wrap;gap:16px 12px;align-content:flex-start}
.mini{position:relative;width:132px;height:186px;flex:none}
.mini .card{transform:scale(.75);transform-origin:0 0;position:absolute;left:0;top:0}
.mini .card:hover{transform:scale(.75) translateY(-6px)}
.mini .cnt{position:absolute;left:0;right:0;bottom:-14px;display:flex;justify-content:center;gap:4px;z-index:3}

.bn span{font-size:14px;opacity:.92}

.bndots i.on{background:var(--blue);width:22px;border-radius:14px}
.sidebtns .sb{width:70px;height:70px}
/* 패스 */
.phead{position:absolute;left:24px;right:24px;top:96px;height:150px;background:#fff;border-radius:8px;box-shadow:0 8px 22px rgba(90,70,150,.12);display:flex;align-items:center;gap:28px;padding:0 28px;box-sizing:border-box;border-left:8px solid #6a4ed9}

.pseason span{font-size:15px;font-weight:700;color:var(--sub)}

.plvbox b{font-family:var(--display);font-weight:800;font-size:52px;line-height:1}
.pxp{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.pxp span{font-weight:900;font-size:17px}
.pxp em{font-style:normal;font-size:14px;color:var(--sub)}
.pbtns{display:flex;flex-direction:column;gap:8px}
.ppremon{font-family:var(--display);font-weight:800;font-size:20px;color:#fff;background:#d39b00;padding:10px 20px;border-radius:14px;text-align:center}
.prow{position:absolute;left:24px;top:290px;width:110px;display:flex;flex-direction:column;gap:150px;z-index:2}
.ptag{height:44px;display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:2px;background:#fff;border-radius:14px;box-shadow:0 4px 12px rgba(90,70,150,.1);font-size:16px;margin-top:40px}
.ptag.p{background:#d39b00;color:#fff;margin-top:0}
.ptrack{position:absolute;left:150px;right:24px;top:262px;bottom:24px;overflow-x:auto;overflow-y:hidden;display:flex;gap:10px;padding:8px 4px 16px;box-sizing:border-box}
.pcol{flex:none;width:120px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.plv{height:34px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:22px;color:#94a3b8;background:#fff;border-radius:14px}
.pcol.reach .plv{color:#fff;background:#6a4ed9}
.pcol.cur .plv{background:var(--gold);color:var(--ink)}
.pcell{position:relative;height:250px;border:2px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px}
.pcell.prem{background:#fffbea;border-color:#f3d77a}
.pcell.ready{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,200,61,.45)}
.pcell.got{opacity:.55}
.pcell .chk{position:absolute;right:8px;top:6px;font-style:normal;font-weight:900;color:#13866a;font-size:20px}
.plock{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:13px;font-weight:900;background:#475569;color:#fff;padding:2px 8px;border-radius:8px}
/* 이벤트 */
.evbg{position:absolute;inset:0;background:#fff7ed;overflow:hidden}
.evbg .stripe{position:absolute;left:-200px;right:-200px;top:520px;height:180px;background:#fed7aa;transform:skewY(-6deg)}
.evbg .track{position:absolute;left:-100px;right:-100px;top:640px;height:120px;background:#ef4444;opacity:.15;transform:skewY(-6deg);border-top:6px dashed #fff;border-bottom:6px dashed #fff}
.evhero{position:absolute;left:24px;top:96px;width:640px;bottom:24px;background:#ea580c;border-radius:8px;overflow:hidden;color:#fff;box-shadow:0 12px 30px rgba(234,88,12,.3)}
.evhero::before{content:"";position:absolute;right:-80px;top:-60px;width:300px;height:900px;background:rgba(255,255,255,.1);transform:skewX(0deg)}
.evfigs{position:absolute;left:20px;bottom:-20px;display:flex;align-items:flex-end}
.evtxt{position:absolute;left:30px;right:30px;top:28px;display:flex;flex-direction:column;gap:8px}
.evtxt small{align-self:flex-start;font-size:14px;font-weight:900;letter-spacing:2px;background:rgba(0,0,0,.22);padding:4px 10px;border-radius:10px}
.evtxt b{font-family:var(--display);font-weight:800;font-size:48px;line-height:1.05}
.evtxt span{font-size:16px;line-height:1.6;max-width:520px}
.evbonus{background:rgba(255,255,255,.18);padding:6px 12px;border-radius:8px;align-self:flex-start;font-weight:700}
.evmed{position:absolute;right:0;top:250px;display:flex;flex-direction:column;align-items:center;background:#fff;color:var(--ink);border-radius:10px;padding:10px 18px}
.evmed b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.evmed small{font-size:13px;font-weight:700;color:var(--sub);background:none;padding:0;letter-spacing:0}
.evmain{position:absolute;left:700px;right:24px;top:164px;bottom:24px;overflow-y:auto}
.evlist{display:flex;flex-direction:column;gap:12px;padding:6px 10px 6px 20px}
.evlist .strow.boss .num{background:#ea580c;color:#fff}
.evshop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:6px}
/* 출석 */
.attgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.att{position:relative;background:#faf8fe;border:2px solid var(--line);border-radius:8px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px}
.att small{font-weight:900;font-size:14px;color:var(--sub)}
.att.today{border-color:var(--gold);background:#fffbea;box-shadow:0 0 0 4px rgba(255,200,61,.4)}
.att.got{opacity:.6}
.stamp2{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);font-family:var(--display);font-weight:800;font-size:22px;color:#c8304f;border:3px solid #c8304f;border-radius:8px;padding:2px 10px;background:rgba(255,255,255,.85)}
/* 배속 · 오토 · 전환 · 인연 */
.btn.spd.on,.btn.auto.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.auto.on{animation:autog 1.2s ease-in-out infinite}
@keyframes autog{50%{box-shadow:0 0 0 4px rgba(139,108,240,.3)}}
.wipe{position:absolute;top:-10%;bottom:-10%;left:-30%;width:160%;background:linear-gradient(90deg,transparent 0 30%,rgba(255,255,255,.95) 30% 48%,#b58cf0 48% 52%,rgba(255,255,255,.95) 52% 70%,transparent 70%);transform:skewX(0deg) translateX(-100%);animation:wipe .55s cubic-bezier(.6,0,.3,1) forwards;z-index:96;pointer-events:none}
@keyframes wipe{from{transform:skewX(0deg) translateX(-100%)}to{transform:skewX(0deg) translateX(100%)}}
.bond{display:flex;align-items:center;gap:10px;background:#fdf2f8;border:1px solid #f9c6dd;border-radius:10px;padding:8px 12px}
.bond .hearts{color:#be185d;font-size:18px;letter-spacing:1px}
.bond b{font-size:16px;color:#be185d}
.bond small{font-size:13px;color:var(--sub)}
.stu .ft{flex:none}
.studetail{left:464px;top:96px}
/* 스토리 · 가이드 */
.sbg{position:absolute;inset:0;filter:blur(2px) saturate(.9)}
.sdim{position:absolute;inset:0;background:rgba(15,23,42,.18)}
.sfig{position:absolute;bottom:-40px;transform:translateX(-50%) scale(.94);filter:brightness(.6) saturate(.7);transition:filter .2s, transform .2s;z-index:2}
.sfig.on{filter:none;transform:translateX(-50%) scale(1);z-index:3}
.stop{position:absolute;left:24px;right:24px;top:20px;display:flex;gap:10px;align-items:center;z-index:6}
.sttl{flex:1;font-weight:900;font-size:17px;color:#fff;background:rgba(43,36,64,.7);padding:8px 16px;border-radius:14px;align-self:flex-start;max-width:max-content;margin-right:auto}
.stop .btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sbox{position:absolute;left:120px;right:120px;bottom:30px;min-height:180px;z-index:5;border:none;cursor:pointer;text-align:left;background:rgba(255,255,255,.96);border-radius:8px;box-shadow:0 12px 36px rgba(15,23,42,.3);padding:44px 40px 26px;box-sizing:border-box;display:block;border-top:6px solid var(--blue)}
.sname{position:absolute;left:30px;top:-24px;background:var(--rc);color:#fff;font-family:var(--display);font-weight:800;font-size:26px;padding:4px 30px;transform:skewX(0deg)}
.stext{display:block;font-size:22px;line-height:1.6;color:var(--ink)}
.stext.narr{font-style:italic;color:#475569}
.snext{position:absolute;right:26px;bottom:14px;font-size:15px;font-weight:900;color:var(--blue);animation:blink 1.2s ease-in-out infinite}
.tutbox{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.tutbox b{font-family:var(--display);font-weight:800;font-size:28px;color:var(--blue)}
.tutbox p{margin:0;font-size:18px;line-height:1.8}
.tutdots{display:flex;gap:6px}.tutdots i{width:8px;height:8px;border-radius:50%;background:#cbd5e1}.tutdots i.on{background:var(--blue);width:22px;border-radius:14px}
.stu .ft{flex-direction:column;align-items:flex-start;gap:0;padding:4px 9px 6px;font-size:15px;line-height:1.25}
.stu .ft span{font-size:13px}
/* 요정님 카드 */
.card.fairy .cf{background:#1f1a2e;border-color:#ff9a3c}
.card.fairy .cart{background:#2a2340}
.card.fairy .cname{color:#f6efe6}
.card.fairy .ctype{color:#ffb36b}
.card.fairy .cdesc{color:#d9d2e6}
.card.fairy .cdesc b{color:#ffb36b}
.card.fairy .gem{box-shadow:0 0 0 3px #ff9a3c, 0 2px 6px rgba(43,36,64,.25)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* ═════ 앙스타 톤: 파스텔 무대 조명 · 유리 패널 · 골드 포인트 · 학생 이미지 컬러 ═════ */
:root{
  --violet:#7a68e3; --lilac:#a996ec; --rose:#d9a3e6; --mint:#8fd8e8; --champ:#e9c46a;
  --grad:linear-gradient(120deg,#6d8ae2 0%,#9f86ec 52%,#d9a3e6 100%);
  --gradGold:linear-gradient(135deg,#fff1c2 0%,#f5c451 45%,#e0a43a 100%);
  --glass:rgba(255,255,255,.86); --glassB:rgba(255,255,255,.95);
  --gshadow:0 10px 30px rgba(110,80,180,.16);
}
body{background:radial-gradient(1200px 700px at 20% 0%,#fbe8f4 0%,transparent 60%),radial-gradient(1200px 800px at 100% 100%,#e2f2fb 0%,transparent 60%),#efe9f8}
#stage{background:#f6f2fc;box-shadow:0 12px 50px rgba(110,80,180,.22);border-radius:12px}
body,#stage{letter-spacing:-.2px}

/* 배경: 파스텔 그라데이션 + 조명 + 반짝이 + 영문 워터마크 */
.bgx{--rc:var(--violet);background:
  radial-gradient(900px 600px at 12% 8%, color-mix(in srgb,var(--rc) 22%,#fff) 0%, transparent 62%),
  radial-gradient(800px 600px at 92% 18%, #fde3f1 0%, transparent 60%),
  radial-gradient(900px 700px at 70% 100%, #dff1fb 0%, transparent 62%),
  linear-gradient(180deg,#faf7ff 0%,#f1ebfb 100%)}
.bgx::before{inset:0;background:radial-gradient(circle,rgba(255,255,255,.9) 0 1.5px,transparent 2px) 0 0/46px 46px;opacity:.55;mask-image:linear-gradient(180deg,#000 0%,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 70%)}
.bgx .beams{position:absolute;left:50%;top:-120px;width:0;height:0}
.bgx .beams i{position:absolute;left:-60px;top:0;width:120px;height:1250px;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 80%);will-change:opacity;animation:beam 9s ease-in-out infinite alternate}
.bgx .beams i:nth-child(1){transform:rotate(38deg);animation-delay:-1s}
.bgx .beams i:nth-child(2){transform:rotate(14deg);animation-delay:-4s;opacity:.7}
.bgx .beams i:nth-child(3){transform:rotate(-12deg);animation-delay:-2s;opacity:.8}
.bgx .beams i:nth-child(4){transform:rotate(-36deg);animation-delay:-6s}
@keyframes beam{from{opacity:.35}to{opacity:.9}}
.bgx .glow{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;will-change:transform;animation:float 12s ease-in-out infinite alternate}
.bgx .g1{left:-80px;top:380px;width:420px;height:420px;background:color-mix(in srgb,var(--rc) 45%,#fff)}
.bgx .g2{right:120px;top:80px;width:320px;height:320px;background:#ffd1e8;animation-delay:-5s}
.bgx .g3{right:-60px;bottom:-60px;width:460px;height:460px;background:#cfeaf8;animation-delay:-8s}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(30px,-26px)}}
.bgx .wm{position:absolute;left:-10px;bottom:90px;font-family:var(--serif);font-weight:600;font-size:250px;line-height:1;letter-spacing:-4px;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--rc) 28%,#fff);white-space:nowrap;user-select:none;opacity:.9}
.bgx .spk{position:absolute;width:var(--z);height:var(--z);background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 6px rgba(255,220,140,.9));animation:twk 3.2s ease-in-out infinite;animation-delay:var(--d)}
.bgx .spk.gd{background:#ffe7a3}
@keyframes twk{0%,100%{opacity:.15;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.bgx .dome,.bgx .tri,.bgx .city{display:none}

/* HUD: 유리 */
.pcard,.hback .ttl,.rs,.iconbtn,.sb,.talk,.chnav button,.strow,.chhead b{background:var(--glass);border:1px solid var(--glassB);box-shadow:var(--gshadow)}
.pcard{border-left:1px solid var(--glassB);border-radius:40px;padding:6px 28px 6px 6px}
.pcard .lv{background:var(--grad);box-shadow:0 4px 12px rgba(139,108,240,.4)}
.pcard .lv b{font-family:'Fredoka';font-weight:800}
.pcard .xp{background:rgba(139,108,240,.15)}
.pcard .xp i{background:var(--grad)}
.hback .back2{width:52px;height:52px;border-radius:50%;background:var(--grad);box-shadow:0 6px 16px rgba(139,108,240,.45);font-size:26px}
.hback .back2:hover{filter:brightness(1.08);background:var(--grad)}
.hback .ttl{border-left:1px solid var(--glassB);border-radius:30px;padding:4px 30px 6px 26px;font-size:28px;display:flex;flex-direction:column;line-height:1.1}
.hback .ttl em{font-family:'Fredoka';font-style:italic;font-weight:800;font-size:13px;letter-spacing:4px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rs{color:var(--ink);border-radius:24px;height:42px}
.rs small{color:var(--mute)}
.rs .plus{border-radius:50%;background:var(--gradGold);color:#6b4200;box-shadow:0 2px 6px rgba(224,164,58,.45)}
.rs .plus:hover{background:var(--gradGold);filter:brightness(1.06)}
.iconbtn{color:var(--violet);border-radius:50%;width:42px;height:42px}
.iconbtn:hover{background:#fff}
.iconbtn svg *{stroke:currentColor}

/* 로비 */
.stu-main{filter:drop-shadow(0 20px 30px rgba(110,80,180,.22))}
.talk{border-top:none;border-radius:22px 22px 22px 6px;padding:16px 20px}
.talk::before{content:"";position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--rc),color-mix(in srgb,var(--rc) 30%,#fff))}
.namebar{gap:0;align-items:center}
.namebar b{border-radius:30px 0 0 30px;background:linear-gradient(120deg,var(--rc),color-mix(in srgb,var(--rc) 55%,#d4b0ee));padding:8px 26px 8px 30px;box-shadow:0 8px 20px color-mix(in srgb,var(--rc) 35%,transparent)}
.namebar span{border-radius:0 30px 30px 0;background:var(--glass);height:46px;color:var(--sub)}
.sb{border-radius:22px;color:var(--ink)}
.sb:hover{background:#fff;transform:translateY(-2px)}
.sb svg *{stroke:var(--violet)}
.dot{background:linear-gradient(135deg,#ff7eb6,#ff4d8d)}
.dockbar{left:24px;bottom:20px;width:auto;height:92px;padding:0 14px;gap:2px;border-radius:30px;transform:none;background:var(--glass);border:1px solid var(--glassB);box-shadow:var(--gshadow)}
.dk{width:112px;transform:none;border-radius:22px;color:var(--ink)}
.dk:hover{background:rgba(139,108,240,.1)}
.dk svg *{stroke:var(--violet)}
.opbtn{right:30px;bottom:24px;width:390px;height:140px;transform:none;border-radius:30px;background:var(--grad);box-shadow:0 14px 34px rgba(160,110,230,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.opbtn > div{transform:none;padding-left:40px}
.opbtn b{font-size:56px;letter-spacing:-1px;text-shadow:0 2px 10px rgba(90,40,160,.25)}
.opbtn b::before{content:"OPERATION";display:block;font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:4px;opacity:.9;margin-bottom:2px}
.opbtn::after{right:auto;left:-120px;top:-40px;width:80px;height:240px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
.opbtn:hover{background:var(--grad);filter:brightness(1.06)}
@keyframes shine{0%,60%{left:-120px}100%{left:460px}}

/* 공통 버튼 */
.btn{border-radius:22px;border-color:var(--line2)}
.btn.primary{background:var(--grad);border-radius:26px;box-shadow:0 8px 20px rgba(160,110,230,.38);position:relative;overflow:hidden}
.btn.primary:hover{background:var(--grad);filter:brightness(1.07)}
.back{background:var(--grad)}
.res2 .plus{background:var(--grad)}

/* 팝업 */
.veil{background:rgba(60,40,100,.32)!important}
.pop2{border-radius:26px;box-shadow:0 30px 80px rgba(80,50,150,.3);border:1px solid #fff}
.pop2 .ph3{background:var(--grad)}
.pop2 .ph3::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);width:90px}
.pop2 .ph3 button{border-radius:50%;background:rgba(255,255,255,.25)}

/* 작전 허브 · 스테이지 */
.hsq{border-radius:28px;background:linear-gradient(140deg,color-mix(in srgb,var(--hc) 70%,#fff) 0%,var(--hc) 55%,color-mix(in srgb,var(--hc) 75%,#cfa4ea) 100%);box-shadow:0 14px 32px color-mix(in srgb,var(--hc) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.hsq::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
.chhead small{background:var(--grad);color:#fff;border-radius:20px;font-family:'Fredoka';font-style:italic}
.chhead b{border-radius:24px}
.chnav .tot{background:var(--grad);border-radius:22px}
.chnav button{border-radius:22px}
.strow{border-radius:24px}
.strow .num{background:linear-gradient(140deg,#f3edff,#e9defc);color:var(--violet);font-family:'Fredoka';font-style:italic}
.strow.boss .num{background:linear-gradient(140deg,#4a3a78,#2b2440);color:#ffe08a}
.area{background:linear-gradient(180deg,#efe6ff 0%,#fbe6f3 100%)}
.area .dome{border-color:#fff}
.area .city i{background:rgba(255,255,255,.65)}

/* 타이틀 */
.title{background:transparent}
.logo{font-weight:900;font-size:76px;letter-spacing:-2px;background:linear-gradient(120deg,#6f55e0 0%,#b06fe0 50%,#f07ab6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(160,110,230,.3))}
.logo small{font-family:var(--serif);font-weight:600;font-size:34px;letter-spacing:6px;color:var(--champ);-webkit-text-fill-color:#d9a640}
.halo{border:3px solid transparent;background:linear-gradient(#f6f2fc,#f6f2fc) padding-box,var(--gradGold) border-box;width:280px}
.tap{font-family:'Fredoka';letter-spacing:3px}

/* 전투 화면: 무대 조명 */
.top{background:rgba(255,255,255,.78);border-bottom:1px solid #fff;box-shadow:0 4px 18px rgba(110,80,180,.1)}
.badge{background:var(--grad);border-radius:16px}
.field{background:
  radial-gradient(700px 420px at 62% 30%, rgba(255,255,255,.85) 0%, transparent 70%),
  radial-gradient(600px 500px at 10% 100%, #fde3f1 0%, transparent 70%),
  linear-gradient(180deg,#ece4fb 0%,#f6effc 100%)}
.dome{border-color:rgba(255,255,255,.95);box-shadow:0 0 60px rgba(181,140,240,.25) inset}
.turn{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.turn small{-webkit-text-fill-color:var(--sub)}

/* 앙스타 톤: 허브 · 이벤트 · 모집 색 */
.hbig{background:linear-gradient(145deg,#8ea4ee 0%,#7a68e3 48%,#9f86ec 100%)!important;border-radius:30px;box-shadow:0 16px 36px rgba(139,108,240,.38)}
.evhero{background:linear-gradient(150deg,#ffc29a 0%,#f5926e 45%,#d9a3e6 100%);border-radius:30px;box-shadow:0 14px 34px rgba(245,146,110,.35)}
.evlist .strow.boss .num{background:linear-gradient(140deg,#f5926e,#d9a3e6)}
.event .ea{background:linear-gradient(160deg,#ffc29a,#f5926e)}
.gbn .stripe{background:linear-gradient(90deg,#9f86ec,#d9a3e6)}
.bn{border-radius:24px!important;background:linear-gradient(135deg,color-mix(in srgb,var(--bc) 80%,#fff),var(--bc) 60%,color-mix(in srgb,var(--bc) 70%,#d9a3e6))!important}
.harea{background:linear-gradient(150deg,#b8a2ff 0%,#7a68e3 50%,#d08ce8 100%)}
.hbig .hfoot,.hbig .hbar{background:rgba(255,255,255,.18)!important}
.gbn{background:radial-gradient(700px 500px at 75% 10%,rgba(255,200,240,.45),transparent 65%),radial-gradient(600px 500px at 15% 90%,rgba(140,200,255,.35),transparent 65%),linear-gradient(160deg,#3b2a6b 0%,#5b3a92 55%,#8a4fa8 100%)}
.gbn .stripe{opacity:.55}
.gbn .stripe2{background:var(--gradGold);height:18px}
.vband{background:var(--grad);transform:skewY(0deg);height:140px;box-shadow:0 14px 40px rgba(160,110,230,.35)}
.vband b{transform:none;font-family:var(--serif);font-weight:600;font-size:110px;letter-spacing:12px;text-shadow:0 4px 24px rgba(255,255,255,.5)}
.vband.fail{background:linear-gradient(120deg,#8a83a3,#b2a8c8)}
.field .city i{background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(222,208,248,.7));border-radius:14px 14px 0 0;box-shadow:0 0 24px rgba(181,140,240,.18)}

/* ═════ 연출 2차: 타격 · 학명 · 턴 · 모집 ═════ */
/* 카드 비행 잔상 */
.trail{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none;z-index:84;background:radial-gradient(circle,#fff 0 25%,var(--bc) 45%,transparent 70%);opacity:0;animation:trail .5s ease-out forwards}
@keyframes trail{0%{opacity:0;transform:scale(.4)}25%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(.2)}}

/* 타격/버프 폭발 */
.burst{position:absolute;width:0;height:0;pointer-events:none;z-index:88}
.burst .ring{position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;border:4px solid var(--bc);box-shadow:0 0 18px var(--bc),inset 0 0 12px #fff;animation:bring .45s cubic-bezier(.2,.8,.3,1) forwards}
.burst .ring.r2{border-width:2px;border-color:#fff;animation-duration:.6s;animation-delay:.05s;opacity:0}
.burst .core{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle,#fff 0 30%,color-mix(in srgb,var(--bc) 70%,#fff) 50%,transparent 72%);animation:bcore .32s ease-out forwards}
.burst i{position:absolute;left:0;top:0;width:var(--l);height:var(--w);margin-top:calc(var(--w) / -2);border-radius:var(--w);transform-origin:0 50%;transform:rotate(var(--a)) translateX(10px) scaleX(0);background:linear-gradient(90deg,#fff,var(--bc) 60%,transparent);animation:bspark .42s cubic-bezier(.1,.8,.3,1) forwards}
.burst.p2 .ring{left:-55px;top:-55px;width:110px;height:110px}
.burst.p3 .ring{left:-75px;top:-75px;width:150px;height:150px;border-width:6px}
.burst.p3 .core{left:-60px;top:-60px;width:120px;height:120px}
.burst.buff i{height:var(--w);width:var(--w);border-radius:0;background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px var(--bc));animation:bstar .6s ease-out forwards}
.burst.buff .ring{border-width:3px;border-style:dashed}
@keyframes bring{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes bcore{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.4);opacity:0}}
@keyframes bspark{0%{transform:rotate(var(--a)) translateX(8px) scaleX(0);opacity:1}40%{transform:rotate(var(--a)) translateX(14px) scaleX(1);opacity:1}100%{transform:rotate(var(--a)) translateX(calc(var(--l) * .9)) scaleX(.2);opacity:0}}
@keyframes bstar{0%{transform:rotate(var(--a)) translateX(10px) scale(.3);opacity:1}100%{transform:rotate(var(--a)) translateX(var(--l)) scale(1.6) rotate(90deg);opacity:0}}
.hitflash{position:absolute;inset:0;z-index:87;pointer-events:none;background:radial-gradient(circle at 60% 40%,rgba(255,255,255,.85),rgba(255,220,240,.35) 60%,transparent);animation:hflash .26s ease-out forwards}
@keyframes hflash{from{opacity:1}to{opacity:0}}

/* 피격: 짧게 멈췄다가 밀려남 (히트스톱 느낌) */
@keyframes hit2{0%{transform:scale(1.07);filter:brightness(2.2) saturate(.2)}18%{transform:scale(1.07);filter:brightness(2.2) saturate(.2)}35%{transform:translateX(14px) scale(.97);filter:none}55%{transform:translateX(-8px)}75%{transform:translateX(4px)}100%{transform:none}}
.foe.hit .art{animation:hit2 .42s cubic-bezier(.2,.7,.3,1)}
.mate.hit{animation:hit2 .42s cubic-bezier(.2,.7,.3,1), redflash .45s ease}

/* 데미지 숫자 */
.float{font-family:'Fredoka',var(--body);font-style:italic;font-weight:800;font-size:34px;letter-spacing:-1px;animation:rise2 1.15s cubic-bezier(.2,.9,.3,1) backwards;
  text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,0 6px 14px rgba(110,80,180,.35)}
.float.big{font-size:58px;text-shadow:0 3px 0 #fff,0 -3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,0 0 24px rgba(255,200,90,.9),0 8px 18px rgba(110,80,180,.35)}
@keyframes rise2{0%{opacity:0;transform:translate(-50%,10px) scale(1.9)}14%{opacity:1;transform:translate(-50%,0) scale(.92)}24%{transform:translate(-50%,-4px) scale(1.04)}70%{opacity:1;transform:translate(-50%,-34px) scale(1)}100%{opacity:0;transform:translate(-50%,-58px) scale(.94)}}

/* 화면 흔들림: 짧고 강하게 */
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-12px,7px) rotate(-.4deg)}25%{transform:translate(10px,-7px) rotate(.3deg)}40%{transform:translate(-7px,4px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}

/* 학명 컷인: 학생 컬러가 화면 전체를 덮는다 */
.cut2{position:absolute;inset:0;z-index:95;pointer-events:none;overflow:hidden;--t:1350ms}
.cut2 .c2bg{position:absolute;inset:0;background:
  radial-gradient(900px 600px at 70% 50%,color-mix(in srgb,var(--rc) 35%,#fff) 0%,transparent 60%),
  linear-gradient(115deg,color-mix(in srgb,var(--rc) 92%,#000) 0%,var(--rc) 40%,color-mix(in srgb,var(--rc) 55%,#cfa4ea) 100%);
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%);animation:c2bg var(--t) cubic-bezier(.7,0,.2,1) forwards}
@keyframes c2bg{0%{clip-path:polygon(0 50%,0 44%,0 54%,0 60%)}11%{clip-path:polygon(0 52%,100% 36%,100% 50%,0 66%)}24%,82%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}100%{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}}
.cut2 .c2rays{position:absolute;left:70%;top:50%;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;background:repeating-conic-gradient(rgba(255,255,255,.16) 0 6deg,transparent 6deg 18deg);animation:c2rays var(--t) linear forwards;mask-image:radial-gradient(circle,#000 10%,transparent 55%);-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 55%)}
@keyframes c2rays{0%,15%{opacity:0;transform:rotate(0)}30%{opacity:1}82%{opacity:1}100%{opacity:0;transform:rotate(25deg)}}
.cut2 .c2streak i{position:absolute;left:-30%;height:3px;width:60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:c2streak calc(var(--t) * .55) linear infinite}
.cut2 .c2streak i:nth-child(1){top:18%;animation-delay:-.1s}.cut2 .c2streak i:nth-child(2){top:34%;height:2px;animation-delay:-.35s}
.cut2 .c2streak i:nth-child(3){top:61%;height:5px;animation-delay:-.2s}.cut2 .c2streak i:nth-child(4){top:76%;animation-delay:-.5s}.cut2 .c2streak i:nth-child(5){top:88%;height:2px;animation-delay:-.05s}
@keyframes c2streak{from{transform:translateX(0)}to{transform:translateX(240%)}}
.cut2 .c2en{position:absolute;left:-40px;top:96px;font-family:var(--serif);font-weight:600;font-size:220px;line-height:1;white-space:nowrap;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.55);letter-spacing:-4px;animation:c2en var(--t) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes c2en{0%,12%{opacity:0;transform:translateX(200px)}30%{opacity:1}82%{opacity:1;transform:translateX(-80px)}100%{opacity:0;transform:translateX(-160px)}}
.cut2 .c2bust{position:absolute;right:90px;bottom:-70px;filter:drop-shadow(0 0 0 #fff) drop-shadow(10px 0 0 rgba(255,255,255,.55)) drop-shadow(0 20px 30px rgba(0,0,0,.25));animation:c2bust var(--t) cubic-bezier(.15,.9,.25,1) forwards}
@keyframes c2bust{0%,14%{opacity:0;transform:translateX(260px) scale(1.08)}34%{opacity:1;transform:translateX(0) scale(1)}82%{opacity:1;transform:translateX(-24px)}100%{opacity:0;transform:translateX(-120px)}}
.cut2 .c2txt{position:absolute;left:120px;top:330px;max-width:820px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;color:#fff;animation:c2txt var(--t) cubic-bezier(.15,.9,.25,1) forwards}
@keyframes c2txt{0%,20%{opacity:0;transform:translateX(-120px)}38%{opacity:1;transform:none}82%{opacity:1;transform:translateX(16px)}100%{opacity:0;transform:translateX(60px)}}
.cut2 .c2txt small{font-family:'Fredoka';font-weight:800;font-style:italic;font-size:18px;letter-spacing:5px;padding:5px 16px;border-radius:20px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5)}
.cut2 .c2txt b{font-family:var(--display);font-weight:900;font-size:104px;line-height:1.05;letter-spacing:-3px;text-shadow:0 6px 24px rgba(0,0,0,.22)}
.cut2 .c2txt span{font-size:24px;font-weight:700;opacity:.95;text-shadow:0 2px 10px rgba(0,0,0,.2)}
.cut2 .c2txt em{font-style:normal;font-size:16px;font-weight:700;letter-spacing:2px;opacity:.8;border-top:1px solid rgba(255,255,255,.5);padding-top:8px;margin-top:6px}
.cut2 .spk{position:absolute;width:var(--z);height:var(--z);background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:twk 1.4s ease-in-out infinite;animation-delay:var(--d);opacity:.8}
.cut2 .c2flash{position:absolute;inset:0;background:#fff;opacity:0;animation:c2flash var(--t) ease forwards}
@keyframes c2flash{0%,12%{opacity:0}18%{opacity:.85}30%{opacity:0}100%{opacity:0}}
.cut2.newstu .c2txt b{font-size:120px}
.cut2.newstu .c2bg{animation-name:c2bgN}
@keyframes c2bgN{0%{clip-path:circle(0% at 70% 50%);opacity:1}22%,86%{clip-path:circle(120% at 70% 50%);opacity:1}100%{clip-path:circle(120% at 70% 50%);opacity:0}}
.cutdim{display:none}

/* 턴 전환 띠 */
.turnban{top:330px;height:120px;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.92) 18%,rgba(255,255,255,.92) 82%,rgba(255,255,255,0) 100%)!important;color:var(--ink);gap:22px;overflow:hidden;box-shadow:none;transform:none!important;flex-direction:row;letter-spacing:0;animation:tban 1.1s cubic-bezier(.2,.9,.2,1) forwards}
.turnban::before,.turnban::after{content:"";position:absolute;left:10%;right:10%;height:4px;background:var(--grad);border-radius:4px}
.turnban::before{top:8px}.turnban::after{bottom:8px}
.turnban em{font-family:var(--serif);font-weight:600;font-size:54px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:6px}
.turnban b{font-family:var(--display);font-weight:900;font-size:50px;color:var(--ink)}
.turnban small{font-family:'Fredoka';font-weight:800;font-style:italic;font-size:20px;letter-spacing:4px;color:var(--sub)}
.turnban.enemy::before,.turnban.enemy::after{background:linear-gradient(90deg,#ff7aa2,#ff4d6d,#ff9a7a)}
.turnban.enemy em{background:linear-gradient(90deg,#ff7aa2,#e8365d);-webkit-background-clip:text;background-clip:text}
.turnban.boss em{font-size:70px}
.turnban .tbshine{position:absolute;top:0;bottom:0;width:120px;left:-200px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);transform:skewX(-20deg);animation:tbshine 1s ease .15s forwards}
@keyframes tbshine{to{left:110%}}
@keyframes tban{0%{opacity:0;clip-path:inset(45% 0 45% 0)}18%{opacity:1;clip-path:inset(0 0 0 0)}80%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(50% 0 50% 0)}}

/* 결과 도장 */
.stamp{border:none;background:rgba(255,255,255,.95);color:transparent;background-image:none;box-shadow:0 20px 50px rgba(139,108,240,.35),0 0 0 4px #fff,0 0 0 8px rgba(181,140,240,.5);border-radius:40px;padding:10px 56px;font-weight:900}
.stamp{-webkit-text-fill-color:initial;color:var(--violet)}
.stamp.lose{color:#8a83a3;box-shadow:0 20px 50px rgba(90,80,120,.3),0 0 0 4px #fff,0 0 0 8px rgba(160,150,190,.5)}

/* 모집: 조명 점등 */
.gstage{position:absolute;inset:0;z-index:94;pointer-events:none;overflow:hidden}
.gstage .gsbg{position:absolute;inset:0;background:radial-gradient(800px 500px at 50% 100%,#5b3a92 0%,#24183f 70%);animation:gsbg .3s ease}
@keyframes gsbg{from{opacity:0}}
.gstage .gsbeam{position:absolute;left:50%;top:-80px;width:0;height:0}
.gstage .gsbeam i{position:absolute;left:-70px;top:0;width:140px;height:1100px;transform-origin:50% 0;background:linear-gradient(180deg,var(--bm) 0%,transparent 85%);opacity:0;mix-blend-mode:screen}
.gstage .gsbeam i:nth-child(1){transform:rotate(34deg);animation:gsb .4s ease .15s forwards}
.gstage .gsbeam i:nth-child(2){transform:rotate(-34deg);animation:gsb .4s ease .3s forwards}
.gstage .gsbeam i:nth-child(3){transform:rotate(17deg);animation:gsb .4s ease .45s forwards}
.gstage .gsbeam i:nth-child(4){transform:rotate(-17deg);animation:gsb .4s ease .6s forwards}
.gstage .gsbeam i:nth-child(5){transform:rotate(0);width:200px;left:-100px;animation:gsb .5s ease .75s forwards}
@keyframes gsb{0%{opacity:0}40%{opacity:1}70%{opacity:.6}100%{opacity:.9}}
.gstage{--bm:rgba(220,205,255,.85);--orb:#e9dcff}
.gstage.g-SR{--bm:rgba(255,222,140,.9);--orb:#ffe08a}
.gstage.g-SSR{--bm:rgba(255,190,230,.95);--orb:#fff1b8}
.gstage .gsorb{position:absolute;left:50%;top:58%;width:30px;height:30px;margin:-15px;border-radius:50%;background:#fff;box-shadow:0 0 40px 20px var(--orb),0 0 120px 60px var(--bm);opacity:0;animation:gsorb 1.25s cubic-bezier(.6,0,.4,1) .2s forwards}
@keyframes gsorb{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1)}75%{transform:scale(1.4)}100%{opacity:1;transform:scale(14)}}
.gstage.g-SSR .gsorb{background:conic-gradient(#ffd1e8,#fff1b8,#c9f0ff,#e0d0ff,#ffd1e8)}
.gstage .gslab{position:absolute;left:0;right:0;top:120px;text-align:center;font-family:var(--serif);font-weight:600;font-size:64px;color:#fff;letter-spacing:6px;opacity:0;animation:gslab .9s ease .35s forwards;text-shadow:0 0 30px var(--bm)}
@keyframes gslab{0%{opacity:0;transform:translateY(16px)}40%{opacity:1;transform:none}100%{opacity:.9}}
.gstage .gsflash{position:absolute;inset:0;background:#fff;opacity:0;animation:gsflash 1.25s ease forwards}
@keyframes gsflash{0%,78%{opacity:0}92%{opacity:1}100%{opacity:1}}
.gstage.g-SSR .gsflash{background:radial-gradient(circle,#fff 40%,#fff1b8 70%,#ffd1e8);animation-duration:1.5s}
.gstage.g-SSR .gsorb{animation-duration:1.5s}

/* 모집 결과 */
.reveal{background:radial-gradient(900px 600px at 50% 0%,#fff 0%,transparent 70%),linear-gradient(180deg,#f3ecff 0%,#fbeaf5 100%)}
.reveal::before{background:radial-gradient(circle,rgba(255,255,255,.95) 0 1.5px,transparent 2px) 0 0/46px 46px;opacity:.7}
.reveal h2{background:none;color:transparent;background-image:var(--grad);-webkit-background-clip:text;background-clip:text;font-size:48px;padding:0}
.reveal h2::before{content:"Scout Result";display:block;text-align:center;font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:6px;-webkit-text-fill-color:#c9a0e8}
.fslot .back{border-radius:16px;background:linear-gradient(150deg,#d9ccfa,#b9a6ee);border:3px solid #fff}
.fslot.r-R .back{background:linear-gradient(150deg,#8ea4ee,#7a68e3)}
.fslot.r-SR .back{background:linear-gradient(150deg,#fff1c2,#f5c451 50%,#e0a43a)}
.fslot.r-SSR .back{background:linear-gradient(150deg,#ffd1e8,#fff1b8 30%,#c9f0ff 60%,#e0d0ff)}
.fslot .back i{border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.9)}
.fslot.r-R .rar{background:var(--grad)}.fslot.r-SR .rar{background:var(--gradGold);color:#6b4200}.fslot.r-SSR .rar{background:linear-gradient(90deg,#ff8fc8,#ffcf6b,#7fd3ff,#a996ec);}
.fslot .tag span{background:var(--grad)}
.stucard{border-radius:16px}

/* 카드 끌어서 사용 */
.hand{touch-action:none}
.ghost.drag{z-index:96;transform:scale(1.12) rotate(-3deg);filter:drop-shadow(0 18px 30px rgba(90,60,160,.35));transition:filter .12s}
.ghost.drag.armed{filter:drop-shadow(0 0 18px rgba(181,140,240,.95)) drop-shadow(0 0 4px #fff)}
.droptgt .art,.mate.droptgt{filter:drop-shadow(0 0 14px rgba(255,120,170,.95)) brightness(1.08)}
.mate.droptgt{outline:4px solid #ff8fc0;outline-offset:2px}
@media (hover:none){
  .hand .card:hover{transform:translateY(var(--dy)) rotate(var(--rot));z-index:auto !important}
  .hand .card:hover .kw{display:none}
}

/* ═════ 로고 색감 · 둥글고 귀여운 톤 (샤니마스/학원마스 참고) ═════ */
:root{
  --blue:#7276e4; --violet:#7a68e3; --peri:#6b86dd; --lilac:#a996ec; --rose:#e2b3e0;
  --grad:linear-gradient(135deg,#6d8ae2 0%,#8f7ae8 52%,#d3a3e6 100%);
  --gradV:linear-gradient(180deg,#e9e4ff 0%,#7e95e6 45%,#8a5fe3 100%);
  --display:'Fredoka','Jua','Noto Sans KR',system-ui,sans-serif;
  --serif:'Fredoka','Jua',system-ui,sans-serif;
  --round:'Fredoka','Jua','Noto Sans KR',sans-serif;
  --gshadow:0 8px 22px rgba(90,100,190,.16);
}
html{font-synthesis:none}
body{background:radial-gradient(1200px 700px at 15% 0%,#e7e0fb 0%,transparent 60%),radial-gradient(1200px 800px at 100% 100%,#dde6fb 0%,transparent 60%),#ece8f8}
#stage{background:#f4f2fd}

/* 배경: 별 · 스트라이프 · 물방울 (학원마스 학교 무늬 + 샤니마스 도트) */
.bgx{--rc:var(--peri);background:
  radial-gradient(900px 600px at 12% 8%, color-mix(in srgb,var(--rc) 24%,#fff) 0%, transparent 62%),
  radial-gradient(800px 600px at 92% 16%, #eadcfb 0%, transparent 60%),
  radial-gradient(900px 700px at 70% 100%, #dbe5fb 0%, transparent 62%),
  linear-gradient(180deg,#f8f7ff 0%,#eeeafb 100%)}
.bgx::before{background:
  radial-gradient(circle,rgba(255,255,255,.95) 0 2px,transparent 2.6px) 0 0/34px 34px,
  repeating-linear-gradient(135deg,transparent 0 22px,rgba(122,104,227,.045) 22px 30px);opacity:.8}
.bgx .g2{background:#e6d4fb}.bgx .g3{background:#d3defb}
.bgx .wm{font-family:'Fredoka',sans-serif;font-weight:700;font-style:normal;font-size:230px;letter-spacing:-6px;-webkit-text-stroke:3px color-mix(in srgb,var(--rc) 22%,#fff)}

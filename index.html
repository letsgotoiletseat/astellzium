/* 화면 전환: 부드러운 페이드 + 살짝 떠오르기 */
.wipe{display:none}
#screen.scrin{animation:scrin .38s cubic-bezier(.2,.8,.25,1)}
@keyframes scrin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.fadev{position:absolute;inset:0;z-index:89;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.0),rgba(236,232,250,.7));animation:fadev .38s ease-out forwards}
@keyframes fadev{from{opacity:1}to{opacity:0}}

/* ═════ 연출 줄이기: 누를 때 튀지 않게, 반복 애니메이션 최소화 ═════ */
button{transition:background-color .15s,box-shadow .15s,filter .15s,opacity .15s}
button:active:not([disabled]){filter:brightness(.94)}
.hsq:hover,.hbig:hover,.epi:hover,.sb:hover,.tile:hover,.cardgrid .card:hover,.stuep:hover{transform:none}
.hsq:hover,.hbig:hover,.epi:hover{filter:brightness(1.03)}
.mini .card:hover{transform:scale(.75)}
.mnode:hover .plat{transform:none;filter:brightness(1.05)}
.foe.tg:hover .art{transform:none}
.stu-main svg,.leader svg{animation:none}
.logoimg{animation:none}
.newb,.tap,.snext{animation:none}
.nextmk{animation:none}
.opbtn::after{display:none}
.bgx .beams i{animation:none;opacity:.55}
.bgx .spk{animation:none;opacity:.55}
.cut2 .spk{animation:none}
.chest.ready{animation:none;box-shadow:0 0 0 3px #f5c451}
.btn.auto.on{animation:none}
.ultb.ready{animation:none;box-shadow:0 0 0 3px #fff,0 0 12px var(--rc)}
.field.holo .foe .art{animation:none}
/* 전투 타격: 더 짧고 담백하게 */
@keyframes hit2{0%{transform:none;filter:brightness(1.5)}30%{transform:translateX(7px);filter:none}65%{transform:translateX(-4px)}100%{transform:none}}
.foe.hit .art{animation:hit2 .3s ease-out}
.mate.hit{animation:hit2 .3s ease-out, redflash .35s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-5px,3px)}45%{transform:translate(4px,-3px)}70%{transform:translate(-2px,1px)}}
.hitflash{opacity:.4}
@keyframes rise2{0%{opacity:0;transform:translate(-50%,8px) scale(1.25)}15%{opacity:1;transform:translate(-50%,0) scale(1)}70%{opacity:1;transform:translate(-50%,-26px)}100%{opacity:0;transform:translate(-50%,-44px)}}
.burst .ring.r2{display:none}
/* 화면 전환: 아주 짧게 */
#screen.scrin{animation:scrin .26s ease-out}
@keyframes scrin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.fadev{display:none}

/* 모집 결과: 빛은 카드 밖(::after)에 둬서 뒤집기를 방해하지 않게 */
.fslot.r-SR::after,.fslot.r-SSR::after{content:"";position:absolute;inset:-6px;border-radius:18px;pointer-events:none;opacity:0;animation:rglow .5s ease forwards;animation-delay:calc(var(--d) + .35s)}
.fslot.r-SR::after{box-shadow:0 0 18px 4px rgba(245,196,81,.75)}
.fslot.r-SSR::after{box-shadow:0 0 22px 6px rgba(255,170,220,.85),0 0 0 3px #fff}
@keyframes rglow{to{opacity:1}}

/* 모집 연출: 교실 문이 열리면 전학생이 */
.gstage{position:absolute;inset:0;z-index:94;pointer-events:none;overflow:hidden;--gc:#cbbdf5;--gc2:#efe8ff}
.gstage.g-SR{--gc:#ffd36b;--gc2:#fff4cc}
.gstage.g-SSR{--gc:#ff9fd0;--gc2:#fff1b8}
.gstage .hall{position:absolute;inset:0;background:linear-gradient(180deg,#f3eefb 0 62%,#e6def4 62% 70%,#d9cfb9 70% 100%);animation:gsin .25s ease-out}
.gstage .hall::before{content:"";position:absolute;left:0;right:0;top:70%;bottom:0;background:repeating-linear-gradient(90deg,transparent 0 158px,rgba(120,100,80,.18) 158px 160px),repeating-linear-gradient(0deg,transparent 0 58px,rgba(120,100,80,.14) 58px 60px)}
.gstage .hall::after{content:"";position:absolute;left:0;right:0;top:61.5%;height:8px;background:#fff}
.gstage .win{position:absolute;top:120px;width:260px;height:260px;border:10px solid #fff;border-radius:10px;background:linear-gradient(180deg,#bfe0ff,#eaf4ff);box-shadow:0 4px 14px rgba(80,70,150,.12)}
.gstage .win.l{left:90px}.gstage .win.r{right:90px}
.gstage .plate{position:absolute;left:50%;top:74px;transform:translateX(-50%);padding:6px 26px;border-radius:10px;background:#fff;border:3px solid #c9a77f;font-family:var(--round);font-size:24px;color:#6b5a44;white-space:nowrap;box-shadow:0 3px 0 #e3d6c4}
.gstage .doorway{position:absolute;left:50%;top:130px;width:470px;height:640px;margin-left:-235px;background:#c9a77f;border-radius:12px 12px 0 0;padding:14px 14px 0;box-sizing:border-box}
.gstage .inside{position:absolute;left:14px;right:14px;top:14px;bottom:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#fff 0%,var(--gc2) 35%,var(--gc) 80%);border-radius:4px 4px 0 0}
.gstage .inside::after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,255,255,.35) 0 8deg,transparent 8deg 24deg);opacity:0;animation:gsrays .9s ease .7s forwards}
.gstage .sil{position:absolute;left:50%;bottom:0;width:230px;height:430px;margin-left:-115px;background:radial-gradient(ellipse 60px 70px at 50% 70px,#3a3156 98%,transparent 100%),radial-gradient(ellipse 110px 260px at 50% 360px,#3a3156 98%,transparent 100%);opacity:0;animation:gssil .6s ease .55s forwards}
.gstage .panel{position:absolute;left:14px;right:14px;top:14px;bottom:0;background:linear-gradient(180deg,#e8d5bd,#dcc4a6);border-radius:4px 4px 0 0;box-shadow:inset 0 0 0 6px #c9a77f;animation:gsdoor .55s cubic-bezier(.6,0,.3,1) .55s forwards}
.gstage .panel::before{content:"";position:absolute;left:44px;right:44px;top:56px;height:230px;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.45));box-shadow:0 0 0 8px #c9a77f,0 0 40px 10px var(--gc) inset;animation:gsglass .5s ease .05s both}
.gstage .panel::after{content:"";position:absolute;left:30px;top:340px;width:16px;height:70px;border-radius:8px;background:#b08d64}
.gstage .gslab{position:absolute;left:0;right:0;top:auto;bottom:46px;letter-spacing:0;font-weight:400;text-align:center;font-family:var(--round);font-size:34px;color:#4b4370;text-shadow:0 2px 0 #fff;opacity:0;animation:gslab2 .4s ease .2s forwards}
.gstage .petal{position:absolute;top:-30px;width:16px;height:12px;border-radius:12px 0 12px 0;background:#ffc9dc;opacity:.9;animation:gspetal 1.6s linear forwards}
.gstage .gsflash{position:absolute;inset:0;background:#fff;opacity:0;animation:gsflash2 1.25s ease forwards}
.gstage.g-SSR .gsflash{animation-duration:1.6s}
@keyframes gsin{from{opacity:0}}
@keyframes gsglass{from{box-shadow:0 0 0 8px #c9a77f,0 0 0 0 var(--gc) inset}}
@keyframes gsdoor{to{transform:translateX(96%)}}
@keyframes gssil{to{opacity:.55}}
@keyframes gsrays{to{opacity:1}}
@keyframes gslab2{to{opacity:1}}
@keyframes gspetal{to{transform:translate(-120px,980px) rotate(540deg)}}
@keyframes gsflash2{0%,80%{opacity:0}100%{opacity:1}}
.gstage .sil{z-index:1}

/* 편성: 학생 변경 (블루아카식 선택 창) */
.scard{cursor:default}
.swapbtn{margin-top:8px;width:100%;height:46px;border:none;border-radius:999px;background:var(--grad);color:#fff;font-family:var(--round);font-size:18px;cursor:pointer;box-shadow:0 3px 0 #5a63c4}

.cafehint{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:6;display:flex;align-items:baseline;gap:12px;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,.92);border:2px solid #fff;box-shadow:0 6px 18px rgba(80,70,150,.14);white-space:nowrap}

@keyframes softIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}

.trail{display:none}

.tb{animation:none}

/* v31: 화면 전환은 위치 이동 없이 페이드만 · 로비 캐릭터 변경 버튼 */

.scard .lkbody span{font-size:14px;line-height:1.6}
.newmate{width:760px;background:#fff;border-radius:28px;padding:26px 30px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 24px 60px rgba(30,22,60,.35)}
.newmate > .nmcard + .nmcard{margin-top:0}
.nmcard{width:100%;border-radius:22px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 22%,#fff),color-mix(in srgb,var(--rc) 6%,#fff) 70%);display:flex;flex-direction:column;align-items:center;padding:16px;gap:4px;position:relative;animation:nmin .5s ease-out}
@keyframes nmin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.nmtag{position:absolute;left:16px;top:14px;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:1px;background:var(--rc);color:#fff;padding:4px 12px;border-radius:10px}
.nmfig{height:250px;display:flex;align-items:flex-end}
.nmcard b{font-family:var(--round,var(--display));font-weight:700;font-size:30px}
.nmcard small{font-size:14px;color:var(--sub);font-weight:700}
.nmcard p{margin:4px 0 0;font-size:15px;color:var(--ink)}
.nmtxt{margin:0;font-size:15px;line-height:1.6;color:var(--sub);text-align:center}
.newmate .bb{min-width:240px}

/* 저사양 모드 */
#stage.lite *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#stage.lite .art,#stage.lite .stu-main,#stage.lite .ghost,#stage.lite .ghost.drag,#stage.lite .ghost.drag.armed{filter:none!important}
#stage.lite .burst,#stage.lite .trail,#stage.lite .hitflash,#stage.lite .pokefx{display:none!important}
#stage.lite .card,#stage.lite .mate,#stage.lite .foe,#stage.lite .sb,#stage.lite .dk,#stage.lite .modal{box-shadow:none!important}
#stage.lite .shake{animation:none!important}
#stage.lite .cut2 .c2rays,#stage.lite .cut2 .c2streak,#stage.lite .cut2 .spk{display:none!important}
#stage.lite .cut2 .c2bust{filter:none!important}
#stage.lite .cut2 .c2txt b,#stage.lite .cut2 .c2txt span{text-shadow:none!important}
.cut2 .c2rays,.cut2 .c2bust,.cut2 .c2en{will-change:transform,opacity}

</style>

const RECORDS={"juhyuk": {"quote": "하아암⋯. 배고파⋯.", "en": "Juhyeok Gwon", "real": "권주혁", "dept": "고등부 1학년 · 무도관 검술학과", "facts": ["17세", "12월 25일 생", "순수 코라인", "남성", "186cm", "80kg", "RH Null"], "school": "편입 전 고등학교 · 신라화랑체육고등학교", "perk": "아스텔지움 아카데미의 매점에 있는 모든 메뉴를 무료로 이용 가능합니다.", "ability": ["「뱀파이어」로 불리우는 이 학명은, 모든 생명체의 피를 조종할 수 있는 힘을 가지고 있습니다.", "권주혁 학생이 늘 등에 매고 다니는 죽도는, 피를 흡수할 시 날카로운 장검의 형태로 변한다는 것을 확인할 수 있었습니다. 이는 「학명」의 매개로써 사용되기 때문에, 검이 없는 상태에서는 「학명」을 사용하는 것이 불가능한 것으로 보입니다.", "아직 시전자가 이제 막 고등학생이 된 미성년자이며, 추후 검이 없는 상태에서도 「학명」을 사용할 수 있도록 숙련도를 쌓아야 할 것이라고 사료되는 바입니다. 이에 따라 권주혁 학생을, 아스텔지움 아카데미 고등부에 편입합니다."], "cls": "디펜더 · 수호자", "clsText": ["디펜더 포지션에 속한 수호자는, 보호막과 회복능력을 이용한 아군보호에 특화되어 있는 포지션입니다.", "비록 교내에 검과 같은 위험한 무기를 소지하고 있으나, 자신의 강함을 과시하기보다는 약자를 지키기 위해 검을 빼어 드는 권주혁 학생 본인의 가치관과 더불어 종합능력평가에서 나타난 행동을 미루어 볼 때, 아군을 수호하는 역할을 더 선호하고 있다고 판단. 이에 따라 학회는 권주혁 학생을 디펜더로 분류합니다."], "traits": [["강한 식탐", "보통 편입 특전으로 '매점 이용권' 같은 것을 요구하는 학생은 많지 않습니다⋯. 식사하는 것을 매우 좋아하는 듯합니다."], ["팔방미인", "종합능력평가 결과에서도 알 수 있듯, 마법능력과 학명응용능력을 제외한 나머지에서는 고등학생이라고 믿을 수 없을 만큼의 뛰어난 능력을 보이고 있습니다. 추후 얼마나 성장할 수 있을지가 가장 기대되는 유망주 중 하나입니다."], ["주사 공포증", "항상 날카로운 검을 소지하고 다니지만, 이상하게도 주사기만큼은 강하게 거부하는 행동양상을 보이고 있습니다. 과거 특정 병원에 자주 입퇴원한 기록이 있는 것으로 보아, 그 영향으로 추측됩니다."]], "stats": [["학명응용능력 ABI", 1, "l"], ["체력 HP", 4, "h"], ["힘 STR", 4, ""], ["방어 DEF", 5, "h"], ["민첩 DEX", 4, ""], ["명중 HIT", 3, ""], ["정신력 POW", 3, ""], ["매력 APP", 4, ""], ["지능 INT", 4, ""], ["마법 MAG", 1, "l"], ["행운 LUC", 3, ""]], "eval": ["전반적으로 일반적인 고등학생과 다를 게 없으나, 신체능력과 운동능력이 매우 월등합니다. 학명응용능력을 키울 수 있도록 방향성에 알맞은 커리큘럼이 필요해 보입니다.", "아스텔지움 아카데미 종합평가위원장"], "notes": [["권주혁 학생의 부상에 대하여", "종합능력평가장에서 일어난 선배들 간의 싸움을 온몸으로 맞아서 막고 보건실로 이송되었습니다. 해당 부상이 완전히 치료된 것은 아니기 때문에, 담당 교육자분께서는 당분간 부상의 케어 위주로 각별히 주의해 주시길 바랍니다.", "아스텔지움 아카데미 보건교사 트레이시 엔젤"], ["앞으로의 교육방침에 대하여", "권주혁 학생의 경우, 교내에서 특정 학생에게 과하게 의존성을 띠고 있는 것이 확인되었습니다. 이는 내면의 상처에 의한 것으로 판단되오니, 담당 교육자님께서는 권주혁 학생의 상처가 무엇인지, 그에 대해 하나하나 알아가실 시간이 필요하실 것으로 사료됩니다.", "아스텔지움 아카데미 이사장"]], "rels": []}, "seran": {"quote": "제 도움이 필요하신가요?", "en const BGM={track:null, next:0, step:0, timer:null, gain:null};
const mtof = m => 440*Math.pow(2,(m-69)/12);
function bnote(f,t,d,type,vol){ const a=AC; if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g).connect(BGM.gain); o.start(t); o.stop(t+d+0.05); }
function bgmTick(){ if(document.hidden) return;
  const a=AC; if(!a||!BGM.track) return; const T=TRACKS[BGM.track], e=60/T.bpm/2;
  while(BGM.next < a.currentTime+0.3){
    const s=BGM.step, bar=Math.floor(s/8)%4, k=s%8, t=BGM.next, ch=T.prog[bar];
    bnote(mtof(ch[k%4]+12), t, e*0.9, 'triangle', .03);
    if(k%4===0) bnote(mtof(T.bass[bar]), t, e*3.6, 'sine', .07);
    const ld=T.lead[Math.floor(s/2)%T.lead.length]; if(k%2===0 && ld) bnote(mtof(ld), t, e*1.8, 'square', .016);
    if(T.drums){ if(k%2===0){ const o=a.createOscillator(), g=a.createGain(); o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(40,t+0.12); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.14); o.connect(g).connect(BGM.gain); o.start(t); o.stop(t+0.16); } }
    BGM.next+=e; BGM.step++;
  }
}
function bgmSet(track){
  if(MUTE || (typeof P!=='undefined' && P && P.bgm===false)) track=null;
  if(BGM.track===track) return;
  BGM.track=track; if(!track) return;
  const a=ac(); if(!a) return;
  if(!BGM.gain){ BGM.gain=a.createGain(); BGM.gain.gain.value=0.9; BGM.gain.connect(a.destination); }
  BGM.next=a.currentTime+0.12; BGM.step=0;
  if(!BGM.timer) BGM.timer=setInterval(bgmTick,100);
}

         lines:['제일 좋아하는 빵이요? …흠. 고르기 힘들어요.','오늘은 야키소바 빵이랑 소보루 먹을 거예요. 짭조름함과 단맛의 조화. 상당히 기대돼요.','춘득이 형은 피자빵. 소시지 들어간 걸로. 나쁘지 않죠.','오늘은 축구부 용병이에요. 끝나면 빵 사러 갈 거예요.','하아암⋯. 아침엔 춘득이 형이 창문 넘어서 깨우러 와요. 저혈압이라⋯ 일어나기 힘들어요.','형한테 시비 거는 사람이 있으면⋯ 그냥 뒤에 서 있어요. 그럼 다들 알아서 가더라고요.'],
         pat:'…빵 주시는 줄 알았어요.',
         rel:'체육관 검술학과 1학년. 말수가 적고 담백하지만 빵 이야기만 나오면 진지해지는 매점 단골. 여러 운동부에 용병으로 불려 다닌다. 몸이 약해 입원해 있던 어린 시절, 다리를 다쳐 들어온 김춘득에게 병원 밖 이야기를 듣고 친구가 됐고, 건강해진 뒤로 춘득을 계속 따라다닌다. 피는 Rh null, 누구에게나 줄 수 있는 황금의 피.'},
  chundeuk:{name:'춘득', full:'김춘득', role:'서포터', rk:'sp', aff:'3학년 · 과학관 컴공학과', color:'#475569', hair:'#e5e7eb', hp:58, mp:8, title:'3학년 · 컴공학과 · 자칭 천재',
         passive:['기밀 접근', '아스텔지움의 기밀에 접근할 수 있다. 전투 첫 턴에 모든 적의 행동 대상이 보인다.'],
         ult:{n:'언노운', cd:5, d:'전투원 전원 1턴 간 은신. 이번 적의 턴에는 아무도 인지되지 않는다.'},
         quote:'가라, 나의 위대한 역작이여! 다 뚫어 버려라!', lobby:'고3치고 키가 작다는 소리는 하지 마. 가장 예민한 부분이라고. 크윽…',
         lines:['주혁이 이 자식, 오늘도 따라왔네. …치킨 사 준다니까 냉큼 오더라.','너 임마, 선배한테 그게 무슨 말버릇이야 임마~ …주혁이 너 말이야.','야. 형이야. 한잔해. 형이잖아ㅋㅋ …콜라요, 콜라.','세란이가 또 스승님이라고 쫓아와요. 학명을 써서라도 도망가야지.','내 옆에 있으면 삼투압으로 똑똑해져야 되는 거 아냐? …주혁이 보면 아닌가 봐요.','야!!! 사람을 치고 갔으면 사과를 해야 할 거 아냐?! 가정교육 독학했어?? …아, 방금 지나간 3학년한테 한 말이에요.','아아악!!! 내가 언제까지 주혁이 뒤치다꺼리를 해야 하는 거냐고!!!'],
         pat:'고3 머리를 쓰다듬는 거예요?! …키 작아서 그러는 거 아니죠?',
         rel:'과학관 컴공학과 3학년. 장난기 많고 선배 티 내기를 좋아하지만, 고3치고 작은 키 얘기만 나오면 예민해진다. 권주혁과는 병원에서 만난 소꿉친구로, 계속 따라오는 주혁을 투덜대면서도 이만한 친구가 없다고 생각한다. 둘이서 마트 치킨 코너에 가는 게 낙. 자신을 스승으로 삼으려 쫓아오는 세란을 학명으로 피해 다닌다.'},
  dabi: {name:'다비', full:'은다비 (다비안느 다비에 드 레오나빈치)', role:'어태커', rk:'at', aff:'2학년 · 예술관 종합예술학과', color:'#b45309', hair:'#f2b8c6', hp:52, mp:8, title:'2학년 · 예술관 · 크리에이터',
         passive:['요정님 동반 허가', '교내에 요정님을 데려올 수 있다. 단, 인명 피해는 금지: 요정님 카드는 사람인 적을 쓰러뜨리지 못하고 HP 1을 남긴다.'],
         ult:{n:'황혼술사', cd:3, d:'다비의 카드가 모두 요정님 카드(고비용 · 고피해)로 바뀐다. 다시 쓰면 다비 카드로 돌아온다.'}, quote:'요정님, 부탁해!', lobby:'하아아아앗~! 또 미셸이랑 눈 마주쳤어~!',
         lines:['응? 미셸이 누구냐구? 그야 나와 같은 2학년 예술관의 마이클 안젤로 말야! 나랑 미셸은 소꿉친구거든.','늘 미셸 곁에서 미셸의 예술을 그 누구보다 가까이서 지켜봤다니까~ 후후…','꺄아… 오늘이야말로 이 러브레터를 꼬옥 미셸에게 전해 줘야겠어! 자, 요정님! 어서 가자!'],
         pat:'헤헤, 요정님 손 차갑다~ 그래도 좋아!',
         rel:'2학년, 예술관. 어릴 적부터 황혼 어스름 기사를 「요정님」이라 부르며 따랐다. 요정님은 투덜대면서도 다비의 집안일과 숙제를 도와준다. 같은 예술관의 소꿉친구 마이클 안젤로(미셸)에게 푹 빠져 있다… 고 모두가 알고 있다.'},
  michel:{name:'미셸', full:'마이클 안젤로', role:'디펜더', rk:'df', aff:'2학년 · 예술관', color:'#64748b', hair:'#cbd5e1', hp:80, mp:8, title:'2학년 · 예술관 · 조소',
         passive:['개인 작업실', '「제 작업실엔 아무도 들이지 마세요. 그게 조건입니다.」 매 턴 시작 시 조각상이 있는 전투원의 조각상 내구도 +2.'],
         ult:{n:'피에타', cd:4, d:'쓰러진 전투원이 있으면 한 명을 HP 30%로 일으켜 세우고 조각상 8. 없으면 HP가 가장 낮은 전투원에게 조각상 14.'},
         quote:'제 작품에 손대지 마세요. 부탁이 아니라 경고입니다.', lobby:'…너, 또 왔습니까? 용건만 말하세요.',
         lines:['조각은 돌 안에 이미 있는 형태를 꺼내는 일입니다. 쓸데없는 건 깎아 내면 그만이죠. …너희들은 그것도 모르는 겁니까?','너희들은 정말 머리가 안 좋군요? 같은 설명을 세 번째 하고 있습니다.','다비요? 시끄럽고 귀찮은 사람입니다. …다치지만 않으면, 상관없습니다.','예술관 작업실엔 제 허락 없이 들어오지 마세요. 너라도 예외는 없습니다.'],
         pat:'…만지지 마세요. 너, 손에 대리석 가루 묻습니다.',
         rel:'2학년, 예술관 조소 전공. 은다비의 소꿉친구. 누구에게나 깍듯한 존댓말을 쓰지만 말끝마다 날이 서 있는 냉소가로, 예민하고 성격이 까다롭다. 유일한 소꿉친구인 다비에게도 차갑게 굴지만, 이상하리만치 그녀 곁을 떠나지 않는다.'},
  ara:  {name:'아라', full:'선우아라', role:'서포터', rk:'sp', aff:'1학년 · 체육관 생활체육학과', color:'#c026d3', hair:'#7c2d12', hp:60, mp:5, title:'1학년 · 생활체육학과 · 여자 배구부',
         passive:['새 운동화', '이사장님이 사 준 새 운동화. 탈을 바꿀 때마다 아라에게 방어도 3, 그 턴에 처음 바꿀 때는 카드 1장 뽑기.'],
         ult:{n:'탈', cd:3, d:'호랑이, 곰, 독수리 탈 중 하나를 골라 쓴다. 행동력 1 회복, 카드 1장 뽑기.'},
         quote:'이번엔 호랑이다냥! 캬오옹!', lobby:'냐아?! 요즘 어린 것들은 말야, 운동하는 사람한테 예의가 없어요! 선배를 봤으면 인사를 해야 할 거 아니냥?!',
         lines:['캬아아악! 그 용병 녀석이 또 배구부에 왔다잖냥?! 여긴 여자배구부라고, 여자배구부!','중학생 쪼꼬미 녀석들이 말야, 인사도 안 하고 지나가더라고요. 냐옹캬옹!','오늘 스파이크 연습 100개! …그 용병 녀석보다는 많이 할 거다냥.'],
         pat:'냐, 냐아?! 갑자기 쓰다듬으면… 캬옹… 나쁘진 않다냥.',
         rel:'체육관 생활체육학과 1학년, 여자 배구부. 흥분하면 고양이 같은 말버릇이 튀어나온다. 여러 운동부에 용병으로 나타나는 권주혁을 경계하고 질투하면서도 실력은 인정한다. 배구부 친구들과 사이가 좋고 친화력이 높다.'},
  minho:{name:'민호', full:'노민호', role:'서포터', rk:'sp', aff:'3학년 · 일반관 · 원예부', color:'#be185d', hair:'#3b1d2b', hp:54, mp:6, title:'3학년 · 원예부 · 노씨 가문 도련님',
         passive:['원예 하우스', '학교 부지에 노씨 가문이 지은 원예 하우스. 전투 시작 시 전투원 전원 새싹 1.'],
         ult:{n:'만개', cd:4, d:'꽃이 한꺼번에 피어난다. 전투원 전원 새싹 2, 방어도 5.'},
         quote:'예쁘게 피어 줘~', lobby:'하이하이~ 잘 지냈니 너희들?~',
         lines:['글쎄 이번에 우리 회사에서 새로 나온 화장품 말인데, 내 피부에 딱 맞는 거 있지?','주리주리에게도 주고 싶었는데 「도련님, 저는 화장 같은 거 잘 못합니다」라며 딱딱하게 거절한 거 있지~? 참 매정해!','뇌물 같은 게 아니라 진심을 다한 선물인데… 언제쯤 주리주리는 내 진실된 마음을 알아줄까?~'],
         pat:'어머, 주리주리~ 손이 참 곱네? 핸드크림 하나 줄까?~',
         rel:'3학년, 일반관, 원예부. 노씨 가문의 도련님으로 집안 회사가 화장품을 만든다. 여동생의 남성공포증 때문에 중학생 때 여장을 시작했고, 여학생들도 착각할 만큼 완벽해졌다. 동생은 다 나았지만 지금도 여장을 이어 간다. 보디가드 주리애를 「주리주리」라고 부른다.'},
  riae: {name:'리애', full:'주리애', role:'디펜더', rk:'df', aff:'2학년 · 일반관', color:'#57534e', hair:'#292524', hp:92, mp:6, title:'2학년 · 노씨 가문 보디가드',
         passive:['근접 경호 (임시)', '전투당 1회, 전투원이 쓰러질 피해를 받으면 리애가 막아 HP 1로 버틴다.'],
         ult:{n:'금강불괴', cd:4, d:'이번 적의 턴 동안 리애는 피해를 받지 않는다. 전투원 전원 방어도 6.'},
         quote:'도려… 큼, 민호 선배. 제 뒤로 물러나 계십시오.', lobby:'도려, 큼… 민호 선배? 방과 후 일정이 있으므로 이만 빠르게 이동하심이 좋을 것 같습니다.',
         lines:['…선물이요? 아뇨, 괜찮습니다.','…제 생일이요? 벌써… 아뇨, 그냥, 저도 까먹어서 그렇습니다.','그럼, 이건 소중히 간직하겠습니다. …감사합니다.','신체 조건상 무도관이 맞다는 말은 자주 듣습니다. 하지만 경호 대상이 일반관이라서요.'],
         pat:'…경호원의 머리를 쓰다듬으시는 건 업무 규정에 없습니다. …싫다는 뜻은 아닙니다.',
         rel:'2학년, 일반관. 노민호의 집안에 고용된 보디가드. 체격과 체력으로는 무도관이 맞지만, 도련님을 보좌하려고 일부러 일반관에 진학했다. 늘 딱딱한 존댓말을 쓰고, 학교에선 「민호 선배」라 부르기로 했지만 자꾸 「도련님」이 먼저 튀어나온다.'},
  abelia:{name:'아베리아', full:'아사베 아베리아', role:'오퍼레이터', rk:'op', op:true, aff:'1학년 · 과학관', color:'#4338ca', hair:'#1e293b', hp:0, mp:5, title:'1학년 · 과학관 · 전파 수집가',
         passive:['새 전파 탐지기', '고친 전파 탐지 기기로 교내 전파를 엿듣는다. 매 턴 시작 시 무작위 적 하나에게 포착. 포착된 적은 턴이 끝날 때 도청 노이즈로 3 피해를 입는다.'],
         ult:{n:'하울링', cd:4, d:'모든 적에게 포착과 1턴 간 흩어져라. 기계 적에게는 6 피해.'},
         quote:'알고 있습니다.', lobby:'…전파 파악. 확인 완료. 수신 전송. 도청 진행.',
         lines:['당신 취미. 수영이죠. 알고 있습니다.','주파수 고정. 잡음 제거. 신호 양호.','어제 저녁. 카레였죠. 알고 있습니다.'],
         pat:'…접촉 감지. 이상 없음. 계속 허가.',
         rel:'1학년, 과학관. 늘 거대한 스피커, 선이 달린 헤드셋, 전파 탐지기를 들고 다닌다. 취미는 도청. 네 글자 남짓으로 끊어지는 짧은 말만 하고, 입버릇은 「알고 있습니다」.'},
  daun: {name:'다운', full:'강다운', role:'어태커', rk:'at', aff:'2학년 · 일반관', color:'#15803d', hair:'#78350f', hp:52, mp:9, title:'2학년 · 철도 오타쿠',
         passive:['순환열차 무제한 이용권', '교내 순환열차를 마음대로 탄다. 전투 시작 시 속도 1. 탐색에서 복도를 지나도 경계도가 오르지 않는다.'],
         ult:{n:'종착역', cd:4, d:'속도를 최대(5)로 올린 뒤 모든 적에게 속도×4 피해. 속도를 모두 소모한다.'},
         quote:'자, 전속 전진이다! 빠아아아아앙!!!', lobby:'자, 열차 출발합니다! 고속 운행 예정이므로 안전벨트 꽉 매시길!',
         lines:['물론 열차에는 안전벨트 같은 건 없지만요! 하하!','이번 역은 매점, 매점입니다. 내리실 문은 오른쪽입니다!','방금 그 구동음 들으셨어요? 저건 분명 초기형 모터예요!'],

function migrate(p){ if(p&&Array.isArray(p.deck)&&typeof CARDS!=='undefined') p.deck=p.deck.filter(k=>CARDS[k]&&!CARDS[k].token);
  if(p&&typeof CARDS!=='undefined'){ if(p.cards) Object.keys(p.cards).forEach(k=>{ if(!CARDS[k]||CARDS[k].token){ delete p.cards[k]; } }); (p.presets||[]).forEach(pr=>{ if(pr&&Array.isArray(pr.deck)) pr.deck=pr.deck.filter(k=>CARDS[k]&&!CARDS[k].token); }); if(p.upg){ delete p.upg.settle1; delete p.upg.settle2; } }
  if(p&&p.cards&&typeof CARDS!=='undefined') ['finals','assembly','wrongnote'].forEach(k=>{ if(CARDS[k]&&!p.cards[k]) p.cards[k]=1; });
  if(p&&p.party&&p.party.df==='ara'){ const alt=['dojin','juhyuk','riae'].find(x=>(p.chars||[]).includes(x))||'dojin'; p.party.df=alt; }
  if(p&&Array.isArray(p.chars)&&p.cards&&typeof CARDS!=='undefined') p.chars.forEach(id=>Object.keys(CARDS).forEach(k=>{ const d=CARDS[k]; if(d.o===id&&!d.form&&!d.token&&!p.cards[k]) p.cards[k]=1; }));
  if(p && p.v===2){
    const old=['dress','demerit','patrol','suspend','rules','essay'];
    old.forEach(k=>delete p.cards[k]); p.deck=p.deck.filter(k=>!old.includes(k));
    if(p.chars.includes('yunseo')){ p.chars=p.chars.filter(x=>x!=='yunseo'); p.chars.push('dabi'); ['scissors','fold','brush','spill','collage','sticker'].forEach(k=>p.cards[k]=Math.max(p.cards[k]||0,1)); }
    if(p.party.at==='yunseo') p.party.at = p.chars.includes('dabi')?'dabi':'tae';
    if(p.leader==='yunseo') p.leader='ina';
    p.v=3;
  }
  if(p && p.v===3){
    const gone=['jab','cover','pat','trace','shutter','cheer','bouquet','water','repot','pollen','fert','green','bloom'];
    gone.forEach(k=>{ delete p.cards[k]; if(p.upg) delete p.upg[k]; }); p.deck=p.deck.filter(k=>!gone.includes(k));
    if(p.chars.includes('haru')){ p.chars=p.chars.filter(x=>x!=='haru'); p.gems+=2000; }
    if(p.party.sp==='haru') p.party.sp='siae'; if(p.leader==='haru') p.leader='ina';
    ['memo','gildongmu','zero','pencil','textbook'].forEach(k=>p.cards[k]=Math.max(p.cards[k]||0,2));
    p.v=4; p.migrated4=true;
  }
  if(p && p.v===4){
    const gone=['remote','letter','speaker','jam']; let refund=0;
    gone.forEach(k=>{ refund+=(p.cards[k]||0)*30; delete p.cards[k]; if(p.upg) delete p.upg[k]; }); p.deck=p.deck.filter(k=>!gone.includes(k));
    if(p.upg && p.upg.flash) delete p.upg.flash;
    p.gems+=refund; p.v=5; p.migrated5=refund;
  }
  return p && p.v===5 ? p : null;
}

}

function setMember(rk,id){
  const old=P.party[rk]; if(old===id) return 0;
  const n=P.deck.filter(k=>CARDS[k]&&CARDS[k].o===old).length;
  P.party[rk]=id; P.deck=P.deck.filter(k=>CARDS[k]&&CARDS[k].o!==old);
  const mine=CHAR_CARDS(id).filter(k=>P.cards[k]&&!CARDS[k].form&&!CARDS[k].token).sort((a,b)=>CARDS[a].c-CARDS[b].c);
  let added=0, guard=0;
  while(added<n && mine.length && guard++<60){ for(const k of mine){ if(added>=n) break; if(deckCount(k)<Math.min(COPY_MAX,P.cards[k]) && P.deck.length<DECK_MAX){ P.deck.push(k); added++; } } if(mine.every(k=>deckCount(k)>=Math.min(COPY_MAX,P.cards[k]))) break; }

  return added;
}

function cleanDeck(){

  return before-P.deck.length;
}
function grantCard(id){
  const have=P.cards[id]||0;
  if(have>=COPY_MAX){ P.gems+=20; return {dup:true}; }
  P.cards[id]=have+1; return {isNew:have===0};
}
function grantChar(id){
  if(owns(id)){ if(ultLv(id)<ULT_MAX){ addShards(id,10); return {dup:true, shard:10}; } P.gems+=200; return {dup:true}; }
  P.chars.push(id); CHAR_CARDS(id).forEach(k=>{ P.cards[k]=Math.max(P.cards[k]||0,1); });
  return {isNew:true};
}

/* ───────── 자동 전투 ───────── */
function autoTarget(c){
  const d=CARDS[c.id];
  if(d.tgt==='enemy'||d.tgt==='unit'){ const es=aliveEnemies(); if(!es.length) return null;
    const killable=es.filter(e=>{ const v=typeof d.pv==='function'?d.pv():d.pv==='drift'?ally('siae').mp*2:d.pv; return v && v>=e.hp+e.block; });
    const t=(killable[0]) || es.slice().sort((x,y)=>(threat(y)-threat(x))||(x.hp-y.hp))[0]; return {t, key:ekey(t)}; }
  if(d.tgt==='ally'){ const al=S.party.filter(a=>validAlly(d,a)); if(!al.length) return null; const t=al.slice().sort((x,y)=>(isOp(x)?1:x.hp/x.maxHp)-(isOp(y)?1:y.hp/y.maxHp))[0]; return {t, key:akey(t)}; }
  return {t:null, key:null};
}
function inaFocus(t){
  const ti=S.party.indexOf(t); let n=0;
  aliveEnemies().forEach(e=>{ e.st.spot=Math.max(e.st.spot||0,1); if(single(e.intent)&&!has(e,'brain')){ e.intent.target={side:'a',i:ti}; n++; } });
  fx(akey(t),'이목 집중!','#6a4ed9',true); if(R4('ina')) addBlock(t,10);
  toast('이목 집중: 모든 시선이 '+CH[t.id].name+'에게'+(n?' · 공격 '+n+'개':''));
}
function siaeConvert(mode){
  const s=ally('siae');
  const ch=s.st.charge||0; s.st.charge=0; const m=ch*3;
  if(!m){ toast('쌓아 둔 잠이 없다'); return; }
  if(mode==='self') addMana(s,m); else distribute(s,m);
  toast((mode==='self'?'결산':'정산')+': 충전 '+ch+' → 마나 '+m);
}
function autoPlan(){
  const b=S.b;
  for(const a of S.party){
    if(a.dead||a.ultCd>0||b.ap<2||['siae','ara'].includes(a.id)) continue;
    if(a.id==='dabi' && (S.forms||{}).dabi==='fairy') continue;
    if(a.id==='juhyuk' && (a.st.gore||0)<10) continue;
    if(a.id==='tae' && !aliveEnemies().some(e=>has(e,'bleed')&&!has(e,'brain')&&isAttack(e.intent))) continue;
    if(a.id==='seran' && (a.st.heat||0)>=3) continue;
    return {ult:a.id};
  }
  const cand=b.hand.filter(c=>!blockReason(c)).map(c=>({c, tg:autoTarget(c)})).filter(x=>x.tg);
  if(!cand.length) return null;
  cand.sort((x,y)=>(costOf(y.c)-costOf(x.c)) || ((CARDS[y.c.id].pv?1:0)-(CARDS[x.c.id].pv?1:0)));
  const z=cand.find(x=>costOf(x.c)===0) || cand[0];
  return {card:z.c, t:z.tg.t, key:z.tg.key};
}
/* 기본 행동: 행동력 1, 학생당 턴 1회. 카드가 아니라 연계에는 영향 없음 */
const BASIC_TXT={at:'고른 적에게 3 피해', df:'자신에게 방어도 3', sp:'HP가 가장 낮은 전투원 HP 2 회복'};
function canBasic(a){ if(!(S.b && S.b.phase==='player' && !S.busy && a && !a.dead && !a.absent && !isOp(a) && S.b.ap>=1 && !(S.b.basicUsed||{})[a.id])) return false; if(CH[a.id].rk==='sp' && !fighters().some(x=>x.hp<x.maxHp)) return false; return true; }
function doBasic(i, e){
  const a=S.party[i]; if(!canBasic(a)) return false; const rk=CH[a.id].rk, b=S.b;
  if(rk==='at' && (!e||e.dead)) return false;
  b.ap-=1; b.basicUsed=b.basicUsed||{}; b.basicUsed[a.id]=1; b.basicPick=null; const pre=snap();
  if(rk==='at'){ b.playing=true; try{ hitEnemy(e,3,a.id); } finally{ b.playing=false; } sfx('hit'); }
  else if(rk==='df'){ addBlock(a,3); }
  else { const t=fighters().slice().sort((x,y)=>x.hp/x.maxHp-y.hp/y.maxHp)[0]; if(t) heal(t,2); }
  logPush({kind:'basic', owner:a.id, tgt:e&&rk==='at'?e.name:null, res:diffRes(pre)});
  checkEnd();
  return true;
}
function scheduleAuto(){
  if(!S.auto||S.autoT) return;
  S.autoT=setTimeout(()=>{ S.autoT=null;
    if(!S.auto||S.screen!=='battle'||!S.b||S.b.phase!=='player'||S.busy||S.modal||S.ending) return;
    const p=autoPlan();
    if(!p){ const f=S.party.findIndex(a=>canBasic(a)); if(f>=0){ const e=aliveEnemies().slice().sort((x,y)=>x.hp-y.hp)[0]; if(doBasic(f,e)){ render(); return; } } endTurn(); return; }
    if(p.ult){ useUlt(p.ult); return; }
    castCard(p.card,p.t,p.key);
  }, 480/(P.speed||1));
}

/* ───────── 인연 ───────── */
const bondLv = id => Math.min(10, 1+Math.floor(((P.bond||{})[id]||0)/100));
function addBond(n){
  P.bond=P.bond||{}; const ups=[];
  const pairIds=activePairs(S.party.map(a=>a.id)).flatMap(p=>[p.a,p.b]);
  S.party.forEach(a=>{ const before=bondLv(a.id); P.bond[a.id]=(P.bond[a.id]||0)+(pairIds.includes(a.id)?Math.round(n*1.5):n); const after=bondLv(a.id); if(after>before){ P.gems+=20*(after-before); addShards(a.id,2*(after-before)); ups.push(CH[a.id].name+' Lv.'+after+' (학명 조각 +'+2*(after-before)+')'); } });
  return ups;
}

/* ───────── 전투 기록 ───────── */
function snap(){ const b=S.b; return { eh:b.enemies.reduce((t,e)=>t+Math.max(0,e.hp),0), ah:S.party.filter(a=>!isOp(a)).reduce((t,a)=>t+a.hp,0), ab:S.party.reduce((t,a)=>t+a.block,0) }; }
function diffRes(pre, enemy){
  const p=snap();
  if(enemy){ const d=pre.ah-p.ah; return d>0?'피해 '+d:''; }
  const dmg=pre.eh-p.eh, heal=p.ah-pre.ah, blk=p.ab-pre.ab;
  return dmg>0?'피해 '+dmg : heal>0?'회복 '+heal : blk>0?'방어도 +'+blk : '';
}
function logPush(x){ if(S.b) S.b.log.push({turn:S.b.turn, ...x}); }
function intentLabel(e){
  const it=e.intent, str=estr(e);
  if(has(e,'brain')) return isAttack(it)?'세뇌 · 다른 적 공격':'세뇌 · 행동 불가';
  switch(it.t){
    case 'atk': return '공격 '+Math.round((it.v+str)*(it.mult||1))+(it.h>1?'×'+it.h:'');
    case 'bleed': return '공격 '+Math.round((it.v+str)*(it.mult||1))+' + 출혈';
    case 'aoe': return (it.charged?'충전 공격 · 전체 ':'전체 공격 ')+(it.v+str);
    case 'aoeBleed': return '전체 '+(it.v+str)+' + 출혈';
    case 'block': return '방어도 '+it.v+(it.str?' · 강화':'');
    case 'blockAll': return '전체 방어도 '+it.v;
    case 'str': return '강화 +'+it.v;
    case 'strAll': return '전체 강화 +'+it.v;
    case 'charge': return '충전 · 다음 턴 전체 '+(it.v+str);
  }
  return '';
}
function intentTarget(e){ const it=e.intent; if(has(e,'brain')) return isAttack(it)?'다른 적':null; if(!single(it)) return it.t.startsWith('aoe')?'전투원 전체':null;
  return it.target.side==='a' ? CH[S.party[it.target.i].id].name : S.b.enemies[it.target.i].name; }

/* ───────── 탐색 진행 ───────── */
function edgeKey(a,b){ return EDGES.some(e=>e[0]===a&&e[1]===b) ? a+'-'+b : EDGES.some(e=>e[0]===b&&e[1]===a) ? b+'-'+a : null; }
function visitedCount(){ return S.map.rooms.filter((r,i)=>r.visited&&i!==0).length; }
function bossLocked(){ return visitedCount()<NEED_ROOMS; }
function travel(i){
  if(S.busy||S.map.walk) return;
  const from=S.map.at; if(i===from) return;
  const key=edgeKey(from,i); if(!key) return toast('복도로 연결된 방만 갈 수 있다');
  if(i===BOSS_ROOM && bossLocked()) return toast('관제실이 잠겨 있다. 방 '+NEED_ROOMS+'개 탐색 필요 ('+visitedCount()+'/'+NEED_ROOMS+')');
  const dir = key.startsWith(from+'-') ? 1 : -1;
  S.map.walk={from, to:i, key, dir, step:0, pos:null};
  continueWalk();
}
async function continueWalk(){
  const w=S.map.walk; if(!w) return;
  S.busy=true; S.screen='map'; render();
  while(w.step<3){
    await bsleep(300);
    const si = w.dir>0 ? w.step : 2-w.step;
    const seg=S.map.cor[w.key][si];
    w.step++; w.pos=si; sfx('step');
    if(!seg.done){
      seg.done=true; seg.seen=true; if(!S.party.some(a=>a.id==='daun'&&!a.dead)) S.alert=Math.min(100,S.alert+3);
      if(seg.ev==='battle'){ render(); await bsleep(250); S.busy=false; startBattle(pick([['drone'],['camera','drone'],['thug']]),'corridor'); return; }
      if(seg.ev==='trap'){ const a=pick(fighters()); const dmg=4+rnd(3); a.hp=Math.max(1,a.hp-dmg); S.alert=Math.min(100,S.alert+12); toast('경보 함정! '+CH[a.id].name+' HP -'+dmg+', 경계도 +12'); }
      if(seg.ev==='curio'){ render(); S.busy=false; openCurio(); return; }
    }
    render();
  }
  await bsleep(200);
  S.map.at=w.to; S.map.walk=null; S.busy=false;
  enterRoom(w.to);
}
function enterRoom(i){
  const r=S.map.rooms[i]; r.visited=true; r.scouted=true; sfx('enter');
  if(r.cleared){ render(); return; }
  r.cleared=true;
  if(r.type==='cls') return startBattle(pick([['drone','drone'],['thug','drone'],['camera','thug'],['robot']]),'room');
  if(r.type==='elite') return startBattle(pick([['rei'],['robot','thug']]),'elite');
  if(r.type==='chest') return openRelicPick();
  if(r.type==='boss') return startBattle(['argos','drone'],'boss');
  if(r.type==='club') return openCurio();
  if(r.type==='clinic'){ S.modal={type:'rest'}; render(); return; }
  render();
}
function resume(){ S.modal=null; S.screen='map'; if(S.map&&S.map.walk) continueWalk(); else render(); }
function openCurio(){ S.modal={type:'curio', c:rnd(CURIOS.length), result:null}; S.screen='map'; render(); }
function curioPick(oi){
  const cu=CURIOS[S.modal.c];
  if(oi===-1){ S.modal.result='그냥 지나쳤다.'; render(); return; }
  const o=cu.opts[oi];
  if(o.key){ if(!S.items.key) return toast('마스터키가 없다'); S.items.key--; }
  S.modal.result=o.f(); render();
}
function useItem(k){
  if(S.busy||S.map.walk||!S.items[k]) return;
  if(k==='key') return toast('마스터키는 물건을 조사할 때 쓴다');
  S.items[k]--;
  if(k==='snack'){ fighters().forEach(a=>healQuiet(a,6)); toast('간식: 전투원 HP 6 회복'); }
  if(k==='bandage'){ const al=fighters().sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp)); if(al[0]){ healQuiet(al[0],14); toast('반창고: '+CH[al[0].id].name+' HP 14 회복'); } }
  if(k==='radio'){ const at=S.map.at; const near=new Set([at]);
    EDGES.forEach(([a,b])=>{ if(a===at) near.add(b); if(b===at) near.add(a); });
    [...near].forEach(r=>{ S.map.rooms[r].scouted=true; EDGES.forEach(([a,b])=>{ if(a===r||b===r) S.map.cor[a+'-'+b].forEach(s=>s.seen=true); }); });
    toast('무전기: 주변을 정찰했다'); }
  render();
}

const PASS_MAX=30, PASS_STEP=250;
function passRw(lv,prem){
  if(!prem){ if(lv%10===0) return {srcard:1}; if(lv%5===0) return {tickets:1}; return lv%2?{credits:5000}:{gems:50}; }
  if(lv===30) return {student:1}; if(lv%10===0) return {tickets:3}; if(lv%5===0) return {tickets:2}; return lv%2?{energy:30}:{gems:80}; }
function ensurePass(){ if(!P.pass||P.pass.season!==SEASON.id) P.pass={season:SEASON.id, xp:0, premium:false, f:{}, p:{}}; }
const passLv = () => { ensurePass(); return Math.min(PASS_MAX, Math.floor(P.pass.xp/PASS_STEP)+1); };
function passXP(n){ ensurePass(); const b=passLv(); P.pass.xp=Math.min(P.pass.xp+n,(PASS_MAX-1)*PASS_STEP); if(passLv()>b) setTimeout(()=>toast('패스 레벨 업! Lv.'+passLv()),500); }
const daysLeft = t => Math.max(0, Math.ceil((t-Date.now())/864e5));
const passReady = () => { ensurePass(); const lv=passLv(); let n=0; for(let L=1;L<=lv;L++){ if(!P.pass.f[L]) n++; if(P.pass.premium&&!P.pass.p[L]) n++; } return n; };
function renderPass(){
  ensurePass(); const lv=passLv(), xpIn=P.pass.xp-(lv-1)*PASS_STEP, max=lv>=PASS_MAX;
  const cols=Array.from({length:PASS_MAX},(_,i)=>{ const L=i+1, reach=lv>=L, fG=!!P.pass.f[L], pG=!!P.pass.p[L];
    return `<div class="pcol ${reach?'reach':''} ${L===lv?'cur':''}"><div class="plv">${L}</div>
      <button class="pcell ${fG?'got':reach?'ready':''}" data-act="passget" data-arg="f${L}" aria-label="무료 ${L}레벨 보상">${rwTiles(passRw(L,false),'',fG)}${fG?'<i class="chk">✓</i>':''}</button>
      <button class="pcell prem ${pG?'got':reach&&P.pass.premium?'ready':''}" data-act="passget" data-arg="p${L}" aria-label="프리미엄 ${L}레벨 보상">${rwTiles(passRw(L,true),'',pG)}${pG?'<i class="chk">✓</i>':''}${P.pass.premium?'':'<span class="plock">🔒</span>'.replace('🔒','잠김')}</button></div>`; }).join('');
  return `${bgx()}
    <div class="phead">
      <div class="pseason"><small>SEASON PASS</small><b>${SEASON.name}</b><span>종료까지 ${daysLeft(SEASON.end)}일</span></div>
      <div class="plvbox"><small>패스 레벨</small><b>${lv}</b></div>
      <div class="pxp"><div class="prog" style="height:14px"><i style="width:${max?100:xpIn/PASS_STEP*100}%;background:var(--blue)"></i></div><span>${max?'최고 레벨 달성':xpIn+' / '+PASS_STEP+' XP'}</span><em>패스 XP: 일일 과제 +100 · 주간 과제 +300 · 작전에서 쓴 에너지 ×4</em></div>
      <div class="pbtns">${P.pass.premium?'<span class="ppremon">프리미엄 활성</span>':'<button class="bb gold" data-act="passbuy"><span>프리미엄 활성화 · 테스트</span></button>'}<button class="bb blue" data-act="passall" ${passReady()?'':'disabled'}><span>모두 받기</span></button></div>

}

const PICKUP=['ina','tae'];
function rollOne(guarantee){
  const locked=Object.keys(CH).filter(id=>!owns(id)&&!EVENT_ONLY.includes(id));
  const r=Math.random();
  if(r<0.03 && locked.length){ const pu=PICKUP.filter(id=>locked.includes(id)); return {char: pu.length&&Math.random()<0.6 ? pick(pu) : pick(locked)}; }
  if(r<0.15) return {card:pick(POOL.SR)};
  if(r<0.60 || guarantee) return {card:pick(POOL.R)};
  return {card:pick(POOL.N)};
}
function pull(n){
  const cost=n===10?PULL10:PULL1;
  const useT=(P.tickets||0)>=n;
  if(!useT && P.gems<cost) return toast('결정이 부족해요');
  if(useT) P.tickets-=n; else P.gems-=cost;
  P.pulls+=n; P.marks=(P.marks||0)+n; ensureDaily(); P.daily.pulls+=n; track('pulls',n);
  const res=[];
  for(let i=0;i<n;i++) res.push(rollOne(false));
  if(n===10 && !res.some(x=>x.char || rarityOf(x.card)!=='N')) res[9]=rollOne(true);
  const out=res.map(x=>{ if(x.char){ const r=grantChar(x.char); return {char:x.char, rar:'SSR', ...r}; } const r=grantCard(x.card); return {card:x.card, rar:rarityOf(x.card), ...r}; });
  save();
  const ssr=out.find(x=>x.char);
  const top=ssr?'SSR':out.some(x=>x.rar==='SR')?'SR':'R';
  if(REDUCED){ S.gacha={out, skip:false}; sfx(ssr?'ssr':'pull'); render(); return; }
  S.busy=true; sfx('pull');
  gachaStage(top).then(()=>{ if(ssr){ sfx('ssr'); return cutinNew(ssr.char); } }).then(()=>{ S.gacha={out, skip:false}; S.busy=false; render(); });
}
function gachaStage(top){

  const price = it.cost.cur==='free' ? '<b>무료</b>' : it.cost.cur==='cash' ? `<b>₩${it.cost.v}</b><small>테스트 버전 · 결제 없이 지급</small>` : `<b>${cur.ic()}${tot.toLocaleString()}</b><small>보유 ${cur.n} ${cur.has().toLocaleString()}</small>`;
  return popup(it.n, `<div class="buybox"><div class="bprev">${shopIcon(it,true)}</div><div class="binfo">${it.d?`<p>${esc(it.d)}</p>`:''}<div class="bget"><span>받는 것</span><div class="items2">${tiles}</div></div>
      ${it.lim?`<span class="bown">${LIMN[it.lim.per]} 구매 제한 ${left} / ${it.lim.n}</span>`:''}${step}<div class="btotal"><span>${it.cost.cur==='cash'?'가격':'합계'}</span>${price}</div></div></div>`,
    `<button class="bb" data-act="close"><span>취소</span></button><button class="bb gold" data-act="shopbuy2" data-arg="${q}" ${cur.has()<tot||left<=0?'disabled':''}><span>구매</span></button>`, 860);
}
function shopPurchase(id, q){
  const it=shopItem(id); if(!it) return; q=Math.max(1,q|0);
  const L=shopLim(), left=leftN(it); if(left<=0||(it.own&&it.own())) return;
  if(it.lim) q=Math.min(q,left);
  const tot=(+it.cost.v||0)*q;
  if(it.cost.cur==='gems'){ if(P.gems<tot) return toast('결정이 부족해요'); P.gems-=tot; }
  else if(it.cost.cur==='credits'){ if(P.credits<tot) return toast('크레딧이 부족해요'); P.credits-=tot; }
  else if(it.cost.cur==='marks'){ if((P.marks||0)<tot) return toast('스카우트 증표가 부족해요'); P.marks-=tot; }
  for(let k=0;k<q;k++){
    if(it.rw.stu){ grantChar(it.rw.stu); }
    else if(it.cat==='gem'){ const fb=firstBuy(it); P.gems+=it.gem+(fb?it.gem:it.bonus); if(fb) L.once['gemfirst'+it.tier]=1; }
    else { const rw={...it.rw}; Object.keys(rw).forEach(k2=>{ if(k2.startsWith('shard:')){ addShards(k2.slice(6),rw[k2]); delete rw[k2]; } }); giveRw(rw); }
  }
  if(it.lim){ if(it.lim.per==='once') L.once[it.id]=(L.once[it.id]||0)+q; else L[it.lim.per].c[it.id]=(L[it.lim.per].c[it.id]||0)+q; }
  if(it.cost.cur!=='free'){ ensureDaily(); P.daily.buys++; }
  save(); sfx('buff');
  toast(it.rw.stu ? CH[it.rw.stu].name+' 합류! 학생부에서 확인하세요' : '「'+it.n+'」'+(q>1?' ×'+q:'')+' 구매 완료');
}

function intentHTML(e,i){
  if(has(e,'slumber')||has(e,'stun')) return `<div class="intent skip" data-intent="e${i}">행동 불가</div>`;
  const it=e.intent, seen=has(e,'spot'), label=intentLabel(e);
  let tgt, tip;
  if(has(e,'brain')){ tgt=null; tip='태이에게 세뇌당했다. '+(isAttack(it)?'다른 적을 공격한다':'아무것도 하지 못한다'); }
  else if(single(it)){ tgt = seen ? intentTarget(e) : '?'; tip = seen ? '포착됨: '+tgt+'을(를) 노린다' : '대상 미확인. 포착하면 누구를 노리는지 보인다'; }
  else if(it.t.startsWith('aoe')){ tgt='전투원 전체'; tip='오퍼레이터를 뺀 아군 전체를 공격한다'; }
  else { tgt=null; tip = it.t==='blockAll'?'적 전체에게 방어도':it.t==='strAll'?'적 전체의 공격력을 올린다':'자신에게 사용'; }
  return `<div class="intent ${seen&&single(it)?'seen':''} ${has(e,'brain')?'brain':''}" data-intent="e${i}" data-tip="${esc(it.k+' · '+label+' · '+tip)}"><span class="ik ${it.k==='주문'?'spell':''}">${it.k}</span><span>${label}</span>${tgt?`<span class="it">→ ${tgt}</span>`:''}</div>`;
}

function drawLines(){
  const svg=document.getElementById('lines'); if(!svg||!S.b) return;

  if(!need){ if(svg.childElementCount>1||svg.dataset.v){ svg.innerHTML=''; svg.dataset.v=''; } return; }
  const sr=document.getElementById('stage').getBoundingClientRect();
  const P_=r=>({x:(r.left-sr.left)/SCALE, y:(r.top-sr.top)/SCALE, w:r.width/SCALE, h:r.height/SCALE});
  let out='<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c8304f"/></marker></defs>';
  S.b.enemies.forEach((e,i)=>{
    if(e.dead||has(e,'brain')||!has(e,'spot')||!single(e.intent)||has(e,'slumber')||has(e,'stun')||e.intent.target.side!=='a') return;
    const fe=document.querySelector(`[data-intent="e${i}"]`), te=document.querySelector(`[data-unit="a${e.intent.target.i}"]`);
    if(!fe||!te) return;
    const a=P_(fe.getBoundingClientRect()), t=P_(te.getBoundingClientRect());
    const x1=a.x, y1=a.y+a.h/2, x2=t.x+t.w+42, y2=t.y+t.h/2;
    out+=`<path d="M${x1} ${y1} C ${x1-240} ${y1}, ${x2+240} ${y2}, ${x2} ${y2}" fill="none" stroke="#c8304f" stroke-width="3" stroke-dasharray="8 7" opacity=".75" marker-end="url(#ah)"/>`;
  });
  if(svg.dataset.v!==out){ svg.innerHTML=out; svg.dataset.v=out; }
}

/* ───────── DOM 패치: 같은 화면에서는 바뀐 부분만 갱신 ───────── */
const mkey = el => { if(el.nodeType!==1) return null; if(el.id) return el.id; const u=el.getAttribute('data-unit'); if(u) return u; const a=el.getAttribute('data-act'); if(a){ const g=el.getAttribute('data-arg'); if(g!==null) return a+':'+g; } return null; };
function morphAttrs(o,n){
  const oa=o.attributes, na=n.attributes;
  for(let i=oa.length-1;i>=0;i--){ const nm=oa[i].name; if(!n.hasAttribute(nm)) o.removeAttribute(nm); }
  for(let i=0;i<na.length;i++){ const {name,value}=na[i]; if(o.getAttribute(name)!==value){ o.setAttribute(name,value); if(name==='value'&&'value' in o) o.value=value; } }
}
function morphKids(a,b){
  const olds=[...a.childNodes], keyed=new Map(), free=[];
  for(const c of olds){ const k=mkey(c); if(k && !keyed.has(k)) keyed.set(k,c); else free.push(c); }
  const used=new Set(); let fi=0;
  const news=[...b.childNodes];
  for(let i=0;i<news.length;i++){
    const nc=news[i], k=mkey(nc); let m=null;
    if(k){ const c=keyed.get(k); if(c && c.tagName===nc.tagName && !used.has(c)) m=c; }
    else { while(fi<free.length){ const c=free[fi++]; if(used.has(c)) continue; if(c.nodeType===nc.nodeType && c.nodeName===nc.nodeName && !mkey(c)){ m=c; break; } } }
    if(m){ used.add(m);
      if(m.nodeType===1){ if(!m.isEqualNode(nc)){ morphAttrs(m,nc); morphKids(m,nc); } } else if(m.nodeValue!==nc.nodeValue) m.nodeValue=nc.nodeValue;
    } else m=nc;
    const at=a.childNodes[i]; if(at!==m) a.insertBefore(m, at||null);
  }
  for(const c of olds) if(!used.has(c) && c.parentNode===a) a.removeChild(c);
}
function morph(el,html){ const t=document.createElement('template'); t.innerHTML=html; morphKids(el,t.content); }
function render(){
  if(RLAST.lite!==!!P.lite){ RLAST.lite=!!P.lite; applyLite(); }
  const scr=document.getElementById('screen'); let h='';
  switch(S.screen){

function unitXY(el,foe){ const sr=document.getElementById('stage').getBoundingClientRect(), r=(foe&&el.querySelector('.art')||el).getBoundingClientRect(); return {x:(r.left+r.width/2-sr.left)/SCALE, y:(r.top+r.height*(foe?.45:.5)-sr.top)/SCALE}; }
function burst(x,y,col,pow,kind){
  if(REDUCED) return; pow=pow||1;
  const d=document.createElement('div'); d.className='burst '+(kind||'hit')+' p'+pow; d.style.left=x+'px'; d.style.top=y+'px'; d.style.setProperty('--bc',col);

  document.getElementById('fx').appendChild(d); setTimeout(()=>d.remove(),700);
}
function trail(x0,y0,x1,y1,col){
  if(REDUCED) return;

    const x=x0+(x1-x0)*t, y=y0+(y1-y0)*t-50*Math.sin(Math.PI*t);

let FXQ=[];
function fx(key,text,color,big){ FXQ.push({key,text,color,big}); }
function flushFx(){
  if(!FXQ.length) return;
  const layer=document.getElementById('fx'), sr=document.getElementById('stage').getBoundingClientRect(); const counts={};
  FXQ.forEach(f=>{
    const el=document.querySelector(`[data-unit="${f.key}"]`); if(!el) return;
    const r=el.getBoundingClientRect(); const n=counts[f.key]=(counts[f.key]||0)+1;
    const d=document.createElement('div'); d.className='float'+(f.big?' big':''); d.textContent=f.text; d.style.color=f.color;

    d.style.left=((isAlly? r.left+r.width*0.62 : r.left+r.width/2)-sr.left)/SCALE+'px';
    d.style.top=((isAlly? r.top+10 : r.top+60)-sr.top)/SCALE+(n-1)*34+'px';
    d.style.animationDelay=(n-1)*0.12+'s';
    layer.appendChild(d); setTimeout(()=>d.remove(),1500+n*120);
  });
  FXQ=[];
}
function toast(t){
  const box=document.getElementById('toasts'); box.querySelectorAll('.toast').forEach(x=>x.remove());

function introSea(on){
  const a=ac(); if(!a||MUTE) return null;
  const n=a.sampleRate*6, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0); let l=0;
  for(let i=0;i<n;i++){ l=l*0.96+(Math.random()*2-1)*0.04; d[i]=l*6; }
  const src=a.createBufferSource(); src.buffer=buf; src.loop=true;
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1100;
  const g=a.createGain(); g.gain.value=0.0001;
  const lfo=a.createOscillator(), lg=a.createGain(); lfo.frequency.value=0.11; lg.gain.value=0.05;
  const base=a.createConstantSource?a.createConstantSource():null;
  lfo.connect(lg).connect(g.gain);
  src.connect(lp).connect(g).connect(a.destination);
  const t=a.currentTime; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.09,t+3.5);
  src.start(); lfo.start();
  return { stop(){ const t2=a.currentTime; try{ g.gain.cancelScheduledValues(t2); g.gain.setValueAtTime(g.gain.value,t2); g.gain.linearRampToValueAtTime(0.0001,t2+1.6); src.stop(t2+1.8); lfo.stop(t2+1.8); }catch(e){} } };
}

  const sleep=ms=>new Promise(r=>{ const t=setTimeout(()=>{wake=null;r();},ms); wake=()=>{clearTimeout(t); wake=null; r();}; });
  const waitTap=(autoMs)=>new Promise(r=>{ let t=null; const go=()=>{ clearTimeout(t); wake=null; r(); }; wake=go; if(auto) t=setTimeout(go,autoMs); waitTap.re=()=>{ clearTimeout(t); if(auto&&wake===go) t=setTimeout(go,900); }; });
  const type=(target,html,plain)=>new Promise(r=>{ let i=0; const chars=[...plain]; target.innerHTML=''; 
    const done=()=>{ clearInterval(iv); typing=null; target.innerHTML=html; r(); };
